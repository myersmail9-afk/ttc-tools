<!DOCTYPE html>
<!--
  TTC Crew — the crew's phone-first menu app.
  All tile content lives in content.js (window.TTC_CONTENT) — edit that file, not this one.
  This file is the shell: header, home grid, category view, search, and the router.
  If you change this file (markup, styles, or app logic), bump SHELL_CACHE in sw.js so
  installed phones pick up the change (content.js edits do NOT need a bump).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem('ttc-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>TTC Crew</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TTC Crew">
<meta name="theme-color" content="#2a3a25">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---- Total Tree Care color tokens (the ONLY colors used anywhere below) ---- */
  :root {
    --ttc-orange:    #C9601A;
    --ttc-orange-dk: #a14d14;
    --ttc-green:     #4a6741;
    --ttc-dark:      #2a3a25;
    --ttc-gold:      #f0c080;
    --ttc-sage:      #B7B681;

    --bg:      #f9f6f2;
    --bg-alt:  #f4f0ea;
    --bg-dark: #2a3a25;
    --card:    #ffffff;
    --raised:  #f4f0ea;

    --fg1:        #1f2419;
    --fg2:        #5a5f55;
    --fg3:        #888888;
    --fg-on-dark: #f9f6f2;

    --border:         rgba(42,58,37,.14);
    --border-soft:    rgba(42,58,37,.08);
    --border-on-dark: rgba(255,255,255,0.18);

    --success-bg: #eaf3de; --success-text: #27500A; --success-border: #97C459;
    --warn-bg:    #faeeda; --warn-text:    #633806; --warn-border:    #EF9F27;
    --info-bg:    #E6F1FB; --info-text:    #0C447C; --info-border:    #85B7EB;
    --danger-bg:  #FCEBEB; --danger-text:  #791F1F; --danger-border:  #F09595;

    --glass-bg:        rgba(255,255,255,.72);
    --glass-bg-soft:   rgba(255,255,255,.55);
    --glass-bg-strong: rgba(255,255,255,.90);
    --glass-border:    rgba(255,255,255,.75);
    --glass-highlight: rgba(255,255,255,.7);
    --topbar-bg:       rgba(42,58,37,.86);
    --overlay-grad: linear-gradient(to bottom, rgba(42,58,37,.62) 0px, rgba(42,58,37,.42) 220px, rgba(249,246,242,.70) 460px, rgba(249,246,242,.86) 100%);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:      #141714;
      --bg-alt:  #1a1f19;
      --card:    #1e231d;
      --raised:  #262c25;
      --fg1:        #f1eee7;
      --fg2:        #b9bcb2;
      --fg3:        #8b9086;
      --border:         rgba(249,246,242,.14);
      --border-soft:    rgba(249,246,242,.08);
      --ttc-orange:     #e0782f;
      --ttc-orange-dk:  #b8621f;
      --success-bg: rgba(151,196,89,.14); --success-text: #9ed97a; --success-border: #6fae46;
      --warn-bg:    rgba(239,159,39,.14); --warn-text:    #f0c674; --warn-border:    #c98a2c;
      --info-bg:    rgba(133,183,235,.14); --info-text:   #8ec2f2; --info-border:   #5f9bd6;
      --danger-bg:  rgba(240,149,149,.14); --danger-text: #f2a3a3; --danger-border: #c96f6f;
      --glass-bg:        rgba(38,44,37,.72);
      --glass-bg-soft:   rgba(38,44,37,.55);
      --glass-bg-strong: rgba(30,35,29,.92);
      --glass-border:    rgba(249,246,242,.14);
      --glass-highlight: rgba(255,255,255,.08);
      --topbar-bg:       rgba(15,18,14,.90);
      --overlay-grad: linear-gradient(to bottom, rgba(0,0,0,.72) 0px, rgba(0,0,0,.55) 220px, rgba(20,23,20,.78) 460px, rgba(20,23,20,.94) 100%);
    }
  }
  :root[data-theme="dark"] {
    --bg:      #141714;
    --bg-alt:  #1a1f19;
    --card:    #1e231d;
    --raised:  #262c25;
    --fg1:        #f1eee7;
    --fg2:        #b9bcb2;
    --fg3:        #8b9086;
    --border:         rgba(249,246,242,.14);
    --border-soft:    rgba(249,246,242,.08);
    --ttc-orange:     #e0782f;
    --ttc-orange-dk:  #b8621f;
    --success-bg: rgba(151,196,89,.14); --success-text: #9ed97a; --success-border: #6fae46;
    --warn-bg:    rgba(239,159,39,.14); --warn-text:    #f0c674; --warn-border:    #c98a2c;
    --info-bg:    rgba(133,183,235,.14); --info-text:   #8ec2f2; --info-border:   #5f9bd6;
    --danger-bg:  rgba(240,149,149,.14); --danger-text: #f2a3a3; --danger-border: #c96f6f;
    --glass-bg:        rgba(38,44,37,.72);
    --glass-bg-soft:   rgba(38,44,37,.55);
    --glass-bg-strong: rgba(30,35,29,.92);
    --glass-border:    rgba(249,246,242,.14);
    --glass-highlight: rgba(255,255,255,.08);
    --topbar-bg:       rgba(15,18,14,.90);
    --overlay-grad: linear-gradient(to bottom, rgba(0,0,0,.72) 0px, rgba(0,0,0,.55) 220px, rgba(20,23,20,.78) 460px, rgba(20,23,20,.94) 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scrollbar-gutter: auto; }
  body {
    background: var(--bg);
    color: var(--fg1);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    position: relative;
  }
  /* ---- Subtle fixed backdrop — two soft tints, never a hue outside the palette ---- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      var(--overlay-grad),
      var(--page-photo, url('assets/photos/ttc-0137.jpg'));
    background-size: cover;
    background-position: center 28%;
    background-repeat: no-repeat;
  }
  .app { max-width: 640px; margin: 0 auto; position: relative; }
  a { text-decoration: none; color: inherit; }
  svg { display: block; }
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--ttc-orange);
    outline-offset: 2px;
  }

  /* ---- Home header (photo header — hero.jpg with a dark-green legibility wash) ---- */
  .header {
    position: relative;
    background: transparent;
    color: var(--fg-on-dark);
    min-height: 250px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: calc(14px + env(safe-area-inset-top)) 20px 22px;
    overflow: hidden;
    border-radius: 0;
  }
  .header-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .version-pill { display: none; }
  .logo-plate {
    display: inline-block;
    background: transparent;
    border-radius: 0;
    padding: 0;
    margin-bottom: 14px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.35));
  }
  .logo-plate img { display: block; width: 104px; height: auto; }
  .app-title { font-weight: 700; font-size: 26px; margin: 0 0 4px; text-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .app-subtitle { font-size: 13px; margin: 0; opacity: .9; text-shadow: 0 1px 6px rgba(0,0,0,.35); }

  /* ---- Front-door crew code gate ---- */
  .gate-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); text-align: center; color: var(--fg-on-dark); }
  .gate-badge { width: 96px; height: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,.35)); margin-bottom: 10px; }
  .gate-title { font-weight: 700; font-size: 26px; margin: 0 0 22px; text-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .gate-card { width: 100%; max-width: 420px; background: var(--glass-bg-strong); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); border: 1px solid var(--glass-border); border-radius: 20px; padding: 22px 18px; box-shadow: 0 1px 2px rgba(42,58,37,.08), 0 12px 32px rgba(42,58,37,.16); color: var(--fg1); text-align: center; }
  .gate-card h2 { font-size: 19px; margin: 0 0 6px; }
  .gate-card p { font-size: 14px; color: var(--fg2); margin: 0 0 16px; line-height: 1.5; }
  .gate-input { width: 100%; height: 56px; border-radius: 14px; border: 1px solid var(--border); font-size: 24px; letter-spacing: .06em; text-align: center; font-family: inherit; background: var(--card); color: var(--fg1); }
  .gate-btn { width: 100%; height: 56px; margin-top: 12px; border: 0; border-radius: 14px; background: var(--ttc-orange); color: #fff; font-size: 17px; font-weight: 700; font-family: inherit; }
  .gate-btn[disabled] { opacity: .6; }
  .gate-msg { margin-top: 12px; font-size: 14px; color: var(--danger-text); background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: 12px; padding: 10px 12px; }
  .gate-msg.quiet { color: var(--fg2); background: transparent; border: 0; padding: 0; }
  /* ---- Emergency (single wide button) ---- */
  .emergency { margin: 18px 20px 0; }
  .emergency-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 56px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--danger-border); color: var(--danger-text);
    font-weight: 700; font-size: 17px; font-family: inherit;
    box-shadow: 0 1px 2px rgba(42,58,37,.06), 0 8px 24px rgba(121,31,31,.10);
    transition: box-shadow .16s ease-out, transform .16s ease-out;
  }
  .emergency-btn:active { transform: translateY(1px); box-shadow: 0 1px 1px rgba(42,58,37,.06), 0 4px 14px rgba(121,31,31,.14); }
  .emergency-btn svg { width: 24px; height: 24px; flex-shrink: 0; }
  .emergency-sheet-link {
    display: block; text-align: center; margin-top: 8px;
    font-size: 13px; color: var(--danger-text); text-decoration: underline;
  }
  /* ---- Ask the brain (single wide button, themed green) ---- */
  .brain-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 56px; border-radius: 18px;
    background: var(--glass-bg-soft);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid rgba(74,103,65,.45); color: var(--ttc-green);
    font-weight: 700; font-size: 17px; font-family: inherit;
    box-shadow: 0 1px 2px rgba(42,58,37,.06), 0 8px 24px rgba(42,58,37,.10);
    transition: box-shadow .16s ease-out, transform .16s ease-out;
  }
  @supports not (backdrop-filter: blur(1px)) {
    .brain-btn { background: var(--glass-bg-strong); }
  }
  .brain-btn:active { transform: translateY(1px); box-shadow: 0 1px 1px rgba(42,58,37,.06), 0 4px 14px rgba(42,58,37,.14); }
  .brain-btn svg { width: 24px; height: 24px; flex-shrink: 0; }

  /* ---- Top bar (category view) ---- */
  .topbar {
    position: sticky; top: 0; z-index: 6;
    display: flex; align-items: center;
    height: calc(56px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: var(--topbar-bg); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--fg-on-dark);
  }
  .topbar-back {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 56px; flex-shrink: 0; color: var(--fg-on-dark);
  }
  .topbar-back svg { width: 22px; height: 22px; }
  .topbar-title {
    flex: 1; text-align: center; font-weight: 600; font-size: 17px;
    padding-right: 48px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- Search ---- */
  .search-wrap {
    position: sticky; z-index: 5;
    background: transparent;
    padding: 12px 20px;
  }
  .search-wrap.search-wrap--overlap {
    position: relative;
    margin-top: -26px;
    padding-top: 0;
    z-index: 7;
  }
  .search-field { position: relative; }
  .search-field svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--fg3); pointer-events: none;
  }
  #search {
    width: 100%; height: 52px; border-radius: 16px;
    border: 1px solid var(--border-soft); padding: 0 16px 0 44px;
    font-size: 16px; background: var(--card); color: var(--fg1);
    font-family: inherit;
    box-shadow: 0 1px 2px rgba(42,58,37,.06), 0 8px 24px rgba(42,58,37,.08);
  }

  /* ---- Home category grid ---- */
  /* position + z-index gives main its OWN stacking context, so the backdrop's z-index
     never leaks out and layers against sibling elements (emergency button, footer). */
  main { position: relative; z-index: 0; padding: 4px 20px 8px; min-height: 40px; }
  /* Photo backdrop behind the home grid only (inserted by JS, home route, no active search) */
  .grid-backdrop { display: none; }
  .grid-backdrop-unused {
    position: absolute;
    top: 0; left: -20px; right: -20px; bottom: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to bottom, rgba(249,246,242,.88) 0%, rgba(249,246,242,.55) 30%, rgba(249,246,242,.55) 70%, rgba(249,246,242,.95) 100%),
      url('assets/photos/ttc-1658.jpg');
    background-size: cover, cover;
    background-position: center, center 40%;
    background-repeat: no-repeat, no-repeat;
    background-attachment: scroll, scroll;
  }
  .grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 8px 0 8px; }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    min-height: 132px;
    background: var(--glass-bg-soft);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    backdrop-filter: blur(16px) saturate(1.25);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(42,58,37,.08), 0 12px 32px rgba(42,58,37,.14), inset 0 1px 0 var(--glass-highlight);
    transition: box-shadow .16s ease-out, transform .16s ease-out;
  }
  @supports not (backdrop-filter: blur(1px)) {
    .card { background: var(--glass-bg-strong); }
  }
  .card:active {
    transform: translateY(1px);
    box-shadow: 0 1px 1px rgba(42,58,37,.06), 0 4px 14px rgba(42,58,37,.12), inset 0 1px 0 var(--glass-highlight);
  }
  .card-icon { margin-bottom: 12px; }
  .card-icon svg { width: 44px; height: 44px; }
  .card-title { font-weight: 600; font-size: 16px; color: var(--fg1); margin-bottom: 4px; }
  .card-count {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--fg3);
  }
  .card-count::before {
    content: ''; display: inline-block; flex-shrink: 0;
    width: 6px; height: 6px; border-radius: 50%; background: var(--ttc-orange);
  }
  .card-unlocked {
    position: absolute; top: 12px; right: 12px;
    font-size: 11px; font-weight: 600;
    background: var(--ttc-gold); color: var(--fg1);
    padding: 3px 8px; border-radius: 999px;
  }

  /* ---- Category head ---- */
  .cat-head {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    margin: 6px 0 18px;
    padding: 20px 18px 18px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: 0 1px 2px rgba(42,58,37,.08), 0 12px 32px rgba(42,58,37,.14), inset 0 1px 0 var(--glass-highlight);
  }
  .cat-head-plate {
    display: flex; align-items: center; justify-content: center;
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--card); margin-bottom: 4px;
    box-shadow: 0 1px 2px rgba(42,58,37,.06), 0 8px 24px rgba(42,58,37,.08);
  }
  .cat-head-plate svg { width: 36px; height: 36px; }
  .cat-head h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--fg1); }
  .cat-head p { margin: 0; font-size: 14px; color: var(--fg2); max-width: 420px; }

  /* ---- Flat search results (home) ---- */
  .result-row { margin-bottom: 14px; }
  .result-cat-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--fg3); margin: 0 0 4px 4px; font-weight: 600;
  }

  /* ---- Group sub-heading (category view) ---- */
  .group-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--fg2); margin: 16px 0 8px; font-weight: 600;
  }

  /* ---- Tiles ---- */
  .tile {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(42,58,37,.08), 0 12px 32px rgba(42,58,37,.14), inset 0 1px 0 var(--glass-highlight);
    overflow: hidden;
  }
  @supports not (backdrop-filter: blur(1px)) { .tile { background: var(--glass-bg-strong); } }
  .tile-main {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; min-height: 56px;
    transition: transform .16s ease-out;
  }
  .tile-main:active { transform: translateY(1px); }
  .tile-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile-label { font-weight: 600; font-size: 16px; color: var(--fg1); }
  .tile-desc { font-size: 13.5px; color: var(--fg2); }
  .tile-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .tile-badge {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    background: none; color: var(--fg3); padding: 0;
    white-space: nowrap;
  }
  .tile-chevron { font-size: 18px; color: #c4c4c4; line-height: 1; }
  .tile-sheet-link {
    display: flex; align-items: center;
    min-height: 32px; padding: 0 16px 8px;
    font-size: 12px; color: var(--fg2); text-decoration: underline;
  }

  .no-match, .load-error {
    text-align: center; color: var(--fg2); font-size: 14px; padding: 28px 8px;
  }
  .hide-office-link {
    display: block; text-align: center; font-size: 13px; color: var(--fg2);
    margin-top: 6px; text-decoration: underline;
  }

  /* ---- Footer ---- */
  .footer-link { display: inline-block; margin-bottom: 12px; font-size: 13px; color: var(--fg2); text-decoration: underline; }
  .footer {
    text-align: center; font-size: 14px; color: var(--fg3);
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .hint-box {
    margin: 10px auto 0; max-width: 420px;
    background: var(--bg-alt); border: none;
    border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--fg2);
  }
  .offline-line { margin-top: 8px; font-size: 13px; color: var(--warn-text); }

  /* ---- Update bar ---- */
  .update-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--ttc-dark); color: var(--fg-on-dark);
    text-align: center; font-size: 14px; font-weight: 600;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }

  @media (prefers-reduced-motion: reduce) {
    .tile-main, .card, .tile, .emergency-btn, .brain-btn { transition: none !important; }
  }

  /* ---- Theme toggle (fixed, every screen: home, category, gate) ---- */
  .theme-fab {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(20,23,20,.4); border: 1px solid rgba(255,255,255,.22);
    color: var(--fg-on-dark); cursor: pointer; padding: 0;
  }
  .theme-fab svg { width: 19px; height: 19px; display: block; }
  @media (prefers-reduced-motion: reduce) { .theme-fab { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="update-bar" id="update-bar" hidden>New version available. Tap to reload.</div>

<button type="button" class="theme-fab" id="theme-fab" aria-label="Theme: system. Tap to change." title="Theme: system"></button>
<script>
(function () {
  'use strict';
  var KEY = 'ttc-theme';
  var ICONS = {
    system: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.3" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 3.7a8.3 8.3 0 0 1 0 16.6z" fill="currentColor" stroke="none"/></svg>',
    dark:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.3A8.4 8.4 0 1 1 9.7 4a7 7 0 0 0 10.3 10.3z"/></svg>',
    light:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2 12h2.6M19.4 12H22M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>'
  };
  var LABEL = { system: 'system', dark: 'dark', light: 'light' };
  var btn = document.getElementById('theme-fab');
  function getStored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function apply(mode) {
    if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
    else document.documentElement.removeAttribute('data-theme');
    if (!btn) return;
    btn.innerHTML = ICONS[mode || 'system'];
    btn.title = 'Theme: ' + LABEL[mode || 'system'];
    btn.setAttribute('aria-label', 'Theme: ' + LABEL[mode || 'system'] + '. Tap to change.');
  }
  var current = getStored();
  apply(current);
  if (btn) {
    btn.addEventListener('click', function () {
      var order = [null, 'dark', 'light'];
      var idx = order.indexOf(current);
      current = order[(idx + 1) % order.length];
      try { if (current) localStorage.setItem(KEY, current); else localStorage.removeItem(KEY); } catch (e) {}
      apply(current);
    });
  }
})();
</script>

<script src="content.js"></script>
<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';

  // ---- Roles (?office=1 / ?office=0, localStorage ttc-crew-roles) ----
  // Rotating background: a different crew photo each time the app is opened (never the same twice in a row).
  var PAGE_PHOTOS = ['ttc-0137', 'ttc-9165', 'ttc-1589', 'ttc-9156', 'ttc-3099'];
  (function pickPhoto() {
    try {
      var last = localStorage.getItem('ttc-crew-last-photo');
      var pool = PAGE_PHOTOS.filter(function (n) { return n !== last; });
      var pick = pool[Math.floor(Math.random() * pool.length)];
      document.documentElement.style.setProperty('--page-photo', "url('assets/photos/" + pick + ".jpg')");
      localStorage.setItem('ttc-crew-last-photo', pick);
    } catch (e) {}
  })();

  var ROLE_KEY = 'ttc-crew-roles';
  function loadRoles() {
    var q = new URLSearchParams(location.search);
    var roles = ['crew'];
    try { roles = JSON.parse(localStorage.getItem(ROLE_KEY) || '["crew"]'); } catch (e) {}
    if (q.get('office') === '1') roles = ['crew', 'office'];
    if (q.get('office') === '0') roles = ['crew'];
    try { localStorage.setItem(ROLE_KEY, JSON.stringify(roles)); } catch (e) {}
    if (q.has('office')) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
    return roles;
  }
  var can = function (item, fallbackRoles, roles) {
    return (item.roles || fallbackRoles || ['crew']).some(function (r) { return roles.indexOf(r) !== -1; });
  };

  var roles = loadRoles();
  var content = (typeof window.TTC_CONTENT !== 'undefined') ? window.TTC_CONTENT : null;

  // ================= Icons =================
  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    return e;
  }
  function baseSvg() {
    var s = el('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    return s;
  }
  function strokePath(d, color) {
    return el('path', { d: d, fill: 'none', stroke: color || 'currentColor', 'stroke-width': '1.75', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  }
  function fillShape(tag, attrs) {
    var a = {};
    for (var k in attrs) a[k] = attrs[k];
    a.fill = 'var(--ttc-orange)';
    a.stroke = 'none';
    return el(tag, a);
  }

  var ICONS = {
    shield: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z'));
      s.appendChild(strokePath('M9 12.2l2 2 4-4.4', 'var(--ttc-orange)'));
      return s;
    },
    book: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M12 6C9.2 4.4 5.3 4 2.5 4.8v13.6c2.8-.8 6.7-.4 9.5 1.2'));
      s.appendChild(strokePath('M12 6c2.8-1.6 6.7-2 9.5-1.2v13.6c-2.8-.8-6.7-.4-9.5 1.2'));
      s.appendChild(fillShape('path', { d: 'M14.5 5.2v5l1.8-1.2 1.8 1.2v-5.6' }));
      return s;
    },
    wrench: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M14.7 6.3a4 4 0 00-5.4 5.4L3.5 17.5l3 3 5.8-5.8a4 4 0 005.4-5.4l-2.1 2.1-2-2 2.1-2.1z'));
      s.appendChild(fillShape('circle', { cx: '7', cy: '17', r: '1.4' }));
      return s;
    },
    clipboard: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M6 5h12v16H6z'));
      s.appendChild(strokePath('M9.5 12h6M9.5 15.5h4'));
      s.appendChild(fillShape('path', { d: 'M9 3.3h6v2.4a1 1 0 01-1 1h-4a1 1 0 01-1-1V3.3z' }));
      return s;
    },
    truck: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M2.5 9.5h11v7h-11z'));
      s.appendChild(strokePath('M13.5 12h4l3 2.7v1.8h-7z'));
      s.appendChild(fillShape('circle', { cx: '6.5', cy: '18', r: '1.7' }));
      s.appendChild(fillShape('circle', { cx: '17', cy: '18', r: '1.7' }));
      return s;
    },
    star: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M12 3.2l2.7 5.6 6.1.7-4.5 4.2 1.2 6-5.5-3-5.5 3 1.2-6-4.5-4.2 6.1-.7z'));
      s.appendChild(fillShape('circle', { cx: '12', cy: '13', r: '1.5' }));
      return s;
    },
    drop: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M12 3c4 5 7 8.7 7 12.2A7 7 0 015 15.2C5 11.7 8 8 12 3z'));
      s.appendChild(strokePath('M9.6 15.3a2.3 2.3 0 002.3 2.1', 'var(--ttc-orange)'));
      return s;
    },
    building: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M5 21V3.5h14V21'));
      s.appendChild(strokePath('M8 7.5h2v2H8zM14 7.5h2v2h-2zM8 12h2v2H8zM14 12h2v2h-2z'));
      s.appendChild(fillShape('path', { d: 'M10 15h4v6h-4z' }));
      return s;
    },
    phone: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z'));
      return s;
    },
    'chevron-left': function () {
      var s = baseSvg();
      s.appendChild(strokePath('M15 5l-7 7 7 7'));
      return s;
    },
    search: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M11 4.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13z'));
      s.appendChild(strokePath('M15.8 15.8l4.2 4.2'));
      return s;
    },
    brain: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M9.5 3.5A3 3 0 0 0 6.6 6.2 3 3 0 0 0 4.4 9.6 3 3 0 0 0 4.9 14.2 3.2 3.2 0 0 0 7.2 19.5c1 .9 2.4 1 3.4.3L11 19V4.4a3 3 0 0 0-1.5-.9z'));
      s.appendChild(strokePath('M14.5 3.5a3 3 0 0 1 2.9 2.7 3 3 0 0 1 2.2 3.4 3 3 0 0 1-.5 4.6 3.2 3.2 0 0 1-2.3 5.3c-1 .9-2.4 1-3.4.3L13 19V4.4a3 3 0 0 1 1.5-.9z'));
      s.appendChild(strokePath('M11 9.5H8.5M13 9.5h2.5M11 13.5H8M13 13.5h3'));
      s.appendChild(fillShape('circle', { cx: '12', cy: '11.5', r: '1.2' }));
      return s;
    },
    tree: function () {
      var s = baseSvg();
      s.appendChild(strokePath('M12 3L5.5 14h13z'));
      s.appendChild(strokePath('M12 14V21'));
      s.appendChild(fillShape('circle', { cx: '12', cy: '8.3', r: '1.3' }));
      return s;
    }
  };
  function icon(name, extraClass) {
    var fn = ICONS[name];
    if (!fn) return document.createElementNS(SVGNS, 'svg');
    var s = fn();
    if (extraClass) s.setAttribute('class', extraClass);
    s.setAttribute('stroke', 'currentColor');
    return s;
  }

  // ================= Shared helpers =================
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function normalize(s) { return (s || '').toString().toLowerCase(); }
  var KIND_LABELS = { sheet: 'Sheet', form: 'Form', doc: 'Doc', pdf: 'PDF', app: 'App', link: 'Link', file: 'File' };

  function visibleSections() {
    if (!content || !content.sections) return [];
    return content.sections.filter(function (section) { return can(section, ['crew'], roles); });
  }
  function findSection(id) {
    var list = visibleSections();
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return null;
  }
  function sectionTiles(section) {
    return section.tiles.filter(function (t) { return can(t, section.roles, roles); });
  }
  function matchesQuery(hay, terms) {
    return terms.every(function (t) { return hay.indexOf(t) !== -1; });
  }
  function queryTerms(q) {
    return normalize(q).trim().split(/\s+/).filter(function (t) { return t.length > 0; });
  }

  function buildTile(tile) {
    var wrap = document.createElement('div');
    wrap.className = 'tile';

    var a = document.createElement('a');
    a.className = 'tile-main';
    a.href = tile.href;
    if (tile.kind !== 'file') {
      a.target = '_blank';
      a.rel = 'noopener';
    }
    var textWrap = document.createElement('div');
    textWrap.className = 'tile-text';
    var labelEl = document.createElement('div');
    labelEl.className = 'tile-label';
    labelEl.textContent = tile.label;
    textWrap.appendChild(labelEl);
    if (tile.desc) {
      var descEl = document.createElement('div');
      descEl.className = 'tile-desc';
      descEl.textContent = tile.desc;
      textWrap.appendChild(descEl);
    }
    a.appendChild(textWrap);

    var right = document.createElement('div');
    right.className = 'tile-right';
    var badge = document.createElement('span');
    badge.className = 'tile-badge';
    badge.textContent = KIND_LABELS[tile.kind] || 'Link';
    right.appendChild(badge);
    var chev = document.createElement('span');
    chev.className = 'tile-chevron';
    chev.setAttribute('aria-hidden', 'true');
    chev.textContent = '›';
    right.appendChild(chev);
    a.appendChild(right);

    wrap.appendChild(a);

    if (tile.sheetHref) {
      var sheetLink = document.createElement('a');
      sheetLink.className = 'tile-sheet-link';
      sheetLink.href = tile.sheetHref;
      sheetLink.target = '_blank';
      sheetLink.rel = 'noopener';
      sheetLink.textContent = tile.sheetLabel || 'Open the sheet';
      wrap.appendChild(sheetLink);
    }

    return wrap;
  }

  function buildSearchField(placeholder, value, onInput) {
    var wrap = document.createElement('div');
    wrap.className = 'search-wrap';
    var field = document.createElement('div');
    field.className = 'search-field';
    field.appendChild(icon('search'));
    var input = document.createElement('input');
    input.type = 'search';
    input.id = 'search';
    input.placeholder = placeholder;
    input.setAttribute('aria-label', 'Search');
    input.value = value || '';
    field.appendChild(input);
    wrap.appendChild(field);
    input.addEventListener('input', function () { onInput(input.value); });
    input.addEventListener('search', function () { onInput(input.value); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { input.value = ''; onInput(''); }
    });
    return { wrap: wrap, input: input };
  }

  function buildEmergencyButton() {
    var section = document.createElement('section');
    section.setAttribute('aria-label', 'Emergency');
    section.className = 'emergency';
    if (content && content.emergency && content.emergency.contacts) {
      var em = content.emergency.contacts;
      var a = document.createElement('a');
      a.className = 'emergency-btn';
      a.href = em.pageHref || em.sheetHref;
      if (!/^http/i.test(a.getAttribute('href') || '')) {
        // In-app page: open in the same window (no target, no rel).
      } else {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      a.appendChild(icon('phone'));
      var label = document.createElement('span');
      label.textContent = em.label;
      a.appendChild(label);
      section.appendChild(a);
    }
    return section;
  }

  function buildBrainButton() {
    var section = document.createElement('section');
    section.setAttribute('aria-label', 'Ask the brain');
    section.className = 'emergency';
    if (content && content.brain) {
      var b = content.brain;
      var a = document.createElement('a');
      a.className = 'brain-btn';
      a.href = b.href;
      if (!/^http/i.test(a.getAttribute('href') || '')) {
        // In-app page: open in the same window (no target, no rel).
      } else {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      a.appendChild(icon('brain'));
      var label = document.createElement('span');
      label.textContent = b.label;
      a.appendChild(label);
      section.appendChild(a);
    }
    return section;
  }

  function buildFooter(opts) {
    var footer = document.createElement('footer');
    footer.className = 'footer';
    if (opts && opts.home) {
      // Home only: the original Employee Resources sheet, the grid this app replaces.
      var orig = document.createElement('a');
      orig.className = 'footer-link';
      orig.href = 'https://docs.google.com/spreadsheets/d/1XjYf1F-ODZ6Yv4_I_jzocY6d1GdiI6JoNH2dc38WrMQ/edit';
      orig.target = '_blank';
      orig.rel = 'noopener';
      orig.textContent = 'Employee Resources sheet (the original)';
      footer.appendChild(orig);
    }
    var v = document.createElement('p');
    v.id = 'footer-version';
    if (content && content.meta) {
      v.textContent = 'Version ' + content.meta.version + '. Updated ' + content.meta.updated + '.';
    }
    footer.appendChild(v);

    var hint = document.createElement('div');
    hint.className = 'hint-box';
    hint.id = 'install-hint';
    hint.hidden = true;
    footer.appendChild(hint);

    var offline = document.createElement('p');
    offline.className = 'offline-line';
    offline.id = 'offline-indicator';
    offline.hidden = true;
    offline.textContent = 'You are offline. Showing the last saved version.';
    footer.appendChild(offline);

    try {
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      if (!standalone) {
        var isIOS = /iPhone|iPad/.test(navigator.userAgent);
        hint.textContent = isIOS
          ? 'To install: tap Share, then Add to Home Screen.'
          : 'To install: open the browser menu, then Install app or Add to Home Screen.';
        hint.hidden = false;
      }
    } catch (e) {}

    try { offline.hidden = navigator.onLine !== false; } catch (e) {}

    return footer;
  }

  function showLoadError(main) {
    clear(main);
    var p = document.createElement('p');
    p.className = 'load-error';
    p.textContent = 'Could not load the list. Check your signal and reopen.';
    main.appendChild(p);
  }

  // ================= Router =================
  var app = document.getElementById('app');
  var currentQuery = '';

  function parseRoute() {
    var h = location.hash || '';
    var m = h.match(/^#\/?([a-z0-9-]*)$/i);
    return m && m[1] ? m[1] : null;
  }

  function route() {
    currentQuery = '';
    var id = parseRoute();
    var section = id ? findSection(id) : null;
    if (!content || !content.sections) {
      clear(app);
      showLoadError(app);
      return;
    }
    if (section) {
      renderCategory(section);
    } else {
      renderHome();
    }
    window.scrollTo(0, 0);
  }

  // ---- Home ----
  function renderHome() {
    clear(app);

    var header = document.createElement('header');
    header.className = 'header';

    var pill = document.createElement('span');
    pill.className = 'version-pill';
    pill.hidden = true;
    if (content && content.meta && content.meta.version) {
      pill.textContent = content.meta.version;
      pill.hidden = false;
    }
    header.appendChild(pill);

    var headContent = document.createElement('div');
    headContent.className = 'header-content';
    var logoPlate = document.createElement('div');
    logoPlate.className = 'logo-plate';
    var logoImg = document.createElement('img');
    logoImg.src = 'badge.png';
    logoImg.alt = 'Total Tree Care';
    logoImg.width = 150;
    logoPlate.appendChild(logoImg);
    headContent.appendChild(logoPlate);
    var h1 = document.createElement('h1');
    h1.className = 'app-title';
    h1.textContent = 'TTC Crew';
    headContent.appendChild(h1);
    var sub = document.createElement('p');
    sub.className = 'app-subtitle';
    sub.textContent = 'Everything the crew needs, one place.';
    headContent.appendChild(sub);
    header.appendChild(headContent);

    app.appendChild(header);


    app.appendChild(buildEmergencyButton());
    app.appendChild(buildBrainButton());

    var main = document.createElement('main');
    main.id = 'main';
    app.appendChild(main);

    app.appendChild(buildFooter({ home: true }));

    renderHomeBody('');
  }

  function renderHomeBody(query) {
    var main = document.getElementById('main');
    if (!main) return;
    clear(main);

    var terms = queryTerms(query);
    var sections = visibleSections();

    if (terms.length === 0) {
      var backdrop = document.createElement('div');
      backdrop.className = 'grid-backdrop';
      backdrop.setAttribute('aria-hidden', 'true');
      main.appendChild(backdrop);

      var grid = document.createElement('div');
      grid.className = 'grid';
      sections.forEach(function (section) {
        var tiles = sectionTiles(section);
        var card = document.createElement('a');
        card.className = 'card';
        card.href = '#/' + section.id;
        if ((section.roles || []).indexOf('office') !== -1) {
          var pill = document.createElement('span');
          pill.className = 'card-unlocked';
          pill.textContent = 'Unlocked';
          card.appendChild(pill);
        }
        var iconWrap = document.createElement('div');
        iconWrap.className = 'card-icon';
        iconWrap.appendChild(icon(section.icon));
        card.appendChild(iconWrap);
        var title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = section.title;
        card.appendChild(title);
        var count = document.createElement('div');
        count.className = 'card-count';
        count.textContent = tiles.length + (tiles.length === 1 ? ' item' : ' items');
        card.appendChild(count);
        grid.appendChild(card);
      });
      main.appendChild(grid);
      return;
    }

    var anyVisible = false;
    sections.forEach(function (section) {
      var tiles = sectionTiles(section).filter(function (tile) {
        var hay = normalize(tile.label) + ' ' + normalize(tile.desc) + ' ' + normalize(tile.search) + ' ' + normalize(section.title);
        return matchesQuery(hay, terms);
      });
      tiles.forEach(function (tile) {
        anyVisible = true;
        var row = document.createElement('div');
        row.className = 'result-row';
        var label = document.createElement('div');
        label.className = 'result-cat-label';
        label.textContent = section.title;
        row.appendChild(label);
        row.appendChild(buildTile(tile));
        main.appendChild(row);
      });
    });

    if (!anyVisible) {
      var msg = document.createElement('p');
      msg.className = 'no-match';
      msg.textContent = 'Nothing matches. Try another word.';
      main.appendChild(msg);
    }
  }

  // ---- Category ----
  function renderCategory(section) {
    clear(app);

    var topbar = document.createElement('div');
    topbar.className = 'topbar';
    var back = document.createElement('a');
    back.className = 'topbar-back';
    back.href = '#/';
    back.setAttribute('aria-label', 'Back');
    back.appendChild(icon('chevron-left'));
    topbar.appendChild(back);
    var title = document.createElement('div');
    title.className = 'topbar-title';
    title.textContent = section.title;
    topbar.appendChild(title);
    app.appendChild(topbar);


    var main = document.createElement('main');
    main.id = 'main';
    app.appendChild(main);

    app.appendChild(buildFooter());

    renderCategoryBody(section, '');
  }

  function renderCategoryBody(section, query) {
    var main = document.getElementById('main');
    if (!main) return;
    clear(main);

    var head = document.createElement('div');
    head.className = 'cat-head';
    var iconPlate = document.createElement('div');
    iconPlate.className = 'cat-head-plate';
    iconPlate.appendChild(icon(section.icon));
    head.appendChild(iconPlate);
    var h2 = document.createElement('h2');
    h2.textContent = section.title;
    head.appendChild(h2);
    if (section.blurb) {
      var p = document.createElement('p');
      p.textContent = section.blurb;
      head.appendChild(p);
    }
    main.appendChild(head);

    var terms = queryTerms(query);
    var tiles = sectionTiles(section).filter(function (tile) {
      if (terms.length === 0) return true;
      var hay = normalize(tile.label) + ' ' + normalize(tile.desc) + ' ' + normalize(tile.search) + ' ' + normalize(section.title);
      return matchesQuery(hay, terms);
    });

    if (tiles.length === 0) {
      var msg = document.createElement('p');
      msg.className = 'no-match';
      msg.textContent = 'Nothing matches. Try another word.';
      main.appendChild(msg);
    } else {
      var prevGroup = null;
      tiles.forEach(function (tile) {
        var g = tile.group || null;
        if (g && g !== prevGroup) {
          var gl = document.createElement('div');
          gl.className = 'group-label';
          gl.textContent = g;
          main.appendChild(gl);
        }
        prevGroup = g;
        main.appendChild(buildTile(tile));
      });
    }

    if ((section.roles || []).indexOf('office') !== -1) {
      var hide = document.createElement('a');
      hide.className = 'hide-office-link';
      hide.href = '?office=0';
      hide.textContent = 'Hide office tools on this phone';
      main.appendChild(hide);
    }
  }

  // ================= Front door: the crew code, asked once per phone =================
  // Level 1 only (the app's files are public on GitHub Pages); the code is checked against the
  // contacts script so a wrong code is refused, then remembered in localStorage.
  var CODE_KEY = 'ttc-crew-code';
  var CODE_CHECK_URL = 'https://script.google.com/macros/s/AKfycbwFLYvp9TH35UjColkwFff0ArONQrT_l-WbG8cFBzS-O0wryMX5PzVBFeBlioHvJz0mZw/exec';
  // The front-door check is LOCAL and instant (no network, works offline): the code is compared
  // against a SHA-256 digest. This is a Level 1 gate for the app's own pages; the contacts data
  // and the brain API check the real code server-side on every request.
  var CODE_DIGEST = '311fe3feed16b9cd8df0f8b1517be5cb86048707df4889ba8dc37d4d68866d02';
  function sha256Hex(str) {
    var enc = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function checkCode(code, attempt, done) {
    try {
      if (!(window.crypto && crypto.subtle)) { done(code === 'yolo' ? 'ok' : 'wrong'); return; }
      sha256Hex(code).then(function (hex) { done(hex === CODE_DIGEST ? 'ok' : 'wrong'); }).catch(function () { done('offline'); });
    } catch (e) { done('offline'); }
  }
  function ensureCrewCode(next) {
    var saved = null; try { saved = localStorage.getItem(CODE_KEY); } catch (e) {}
    if (saved) { next(); return; }
    clear(app);
    var wrap = document.createElement('div'); wrap.className = 'gate-wrap';
    var badge = document.createElement('img'); badge.className = 'gate-badge'; badge.src = 'badge.png'; badge.alt = '';
    var title = document.createElement('div'); title.className = 'gate-title'; title.textContent = 'TTC Crew';
    var card = document.createElement('div'); card.className = 'gate-card';
    var h2 = document.createElement('h2'); h2.textContent = 'Enter the crew code';
    var p = document.createElement('p'); p.textContent = 'Ask Joseph or David for it. This phone remembers it after the first time.';
    var form = document.createElement('form');
    var input = document.createElement('input'); input.className = 'gate-input'; input.type = 'text'; input.autocomplete = 'off'; input.setAttribute('autocapitalize','none'); input.spellcheck = false; input.maxLength = 24; input.setAttribute('aria-label', 'Crew code');
    var btn = document.createElement('button'); btn.className = 'gate-btn'; btn.type = 'submit'; btn.textContent = 'Open the App';
    var msg = document.createElement('div'); msg.className = 'gate-msg quiet'; msg.hidden = true;
    form.appendChild(input); form.appendChild(btn);
    card.appendChild(h2); card.appendChild(p); card.appendChild(form); card.appendChild(msg);
    wrap.appendChild(badge); wrap.appendChild(title); wrap.appendChild(card);
    app.appendChild(wrap);
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 50);
    // Some phone keyboards send Enter without firing the form's submit; handle it explicitly.
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.keyCode === 13) {
        ev.preventDefault();
        if (form.requestSubmit) form.requestSubmit(); else btn.click();
      }
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var code = input.value.trim().toLowerCase();
      if (!code) return;
      btn.disabled = true; btn.textContent = 'Checking';
      msg.className = 'gate-msg quiet'; msg.hidden = false; msg.textContent = 'One moment.';
      checkCode(code, 0, function (result) {
        if (result === 'ok') {
          try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
          next();
        } else if (result === 'wrong') {
          btn.disabled = false; btn.textContent = 'Open the App';
          msg.className = 'gate-msg'; msg.textContent = 'That code did not match. Try again.';
        } else {
          btn.disabled = false; btn.textContent = 'Open the App';
          msg.className = 'gate-msg'; msg.textContent = 'Could not check the code on this phone. Try again.';
        }
      });
    });
  }

  // ================= Boot =================
  try {
    if (content && content.sections) {
      ensureCrewCode(function () {
        window.addEventListener('hashchange', route);
        route();
      });
    } else {
      clear(app);
      app.appendChild(buildFooter());
      showLoadError(app);
    }
  } catch (e) {
    clear(app);
    showLoadError(app);
  }

  window.addEventListener('online', function () {
    var el2 = document.getElementById('offline-indicator');
    if (el2) el2.hidden = true;
  });
  window.addEventListener('offline', function () {
    var el2 = document.getElementById('offline-indicator');
    if (el2) el2.hidden = false;
  });

  // ---- Service worker + update bar ----
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        try { reg.update(); } catch (e) {}
        reg.addEventListener('updatefound', function () {
          try {
            var newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                var bar = document.getElementById('update-bar');
                if (bar) {
                  bar.hidden = false;
                  bar.addEventListener('click', function () { location.reload(); });
                }
              }
            });
          } catch (e) {}
        });
      }).catch(function () {});
    }
  } catch (e) {}

})();
</script>
