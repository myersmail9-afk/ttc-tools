<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTC Crew has moved</title>
<meta name="theme-color" content="#2a3a25">
<style>
  :root{--bg:#f4f0ea;--card:#ffffff;--ink:#1a1a1a;--muted:#5b5f55;--band:#2a3a25;--accent:#C9601A;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#141b12;--card:#1d2719;--ink:#f1eee7;--muted:#b8bcae;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
  main{max-width:440px;width:100%;background:var(--card);border-radius:18px;padding:28px 24px;text-align:center;
       box-shadow:0 1px 0 rgba(0,0,0,.06)}
  h1{font:800 26px/1.15 Montserrat,-apple-system,BlinkMacSystemFont,sans-serif;margin:0 0 10px}
  p{margin:0 0 16px;color:var(--muted)}
  a.go{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:14px 18px;margin:8px 0 16px}
  a.go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>TTC Crew has moved</h1>
  <p>The app has a new address. Your training progress came with it.</p>
  <a class="go" id="go" href="https://ttc-crew.totaltreecareutah.workers.dev/">Open the new TTC Crew</a>
  <p>Then add the new one to your home screen and delete this old icon.</p>
  <small>Taking you there in a few seconds.</small>
</main>
<script>
  // The retirement worker (sw.js) clears this address's saved copy; this page then sends people on.
  setTimeout(function () { location.replace(document.getElementById('go').href); }, 4000);
</script>
</body>
</html>
