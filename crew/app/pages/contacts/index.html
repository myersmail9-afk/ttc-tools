<!DOCTYPE html>
<!--
  TTC Crew — Crew Emergency Contacts.
  Self-contained page: inline CSS + vanilla JS, no libraries. Fetches the contact list as JSON
  from the Apps Script web app (no cookies, so it sidesteps the "Sorry, unable to open the file
  at this time" problem phones hit opening Apps Script pages directly in the browser). The crew
  code gates the fetch; it is never hardcoded here and never logged.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style id="ttc-auth-prehide">html:not(.ttc-auth-ready) body > :not(#ttc-auth-gate){visibility:hidden!important}html:not(.ttc-auth-ready) body::before{content:"Opening TTC Crew sign-in… If this stays here, check your connection and reload.";display:block;padding:2rem;font:16px/1.5 system-ui}</style>
<noscript><style>body::before{content:"Turn on JavaScript to sign in to TTC Crew."!important}</style></noscript>
<script src="../../shared/auth-gate.js"></script>
<script>(function(){try{var t=localStorage.getItem('ttc-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Crew Emergency Contacts — TTC Crew</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ttc-orange:    #C9601A;
    --ttc-orange-dk: #a14d14;
    --ttc-green:     #4a6741;
    --ttc-dark:      #2a3a25;
    --ttc-gold:      #f0c080;
    --ttc-sage:      #B7B681;

    --bg:      #f9f6f2;
    --bg-alt:  #f4f0ea;
    --bg-dark: #2a3a25;
    --card:    #ffffff;
    --raised:  #f4f0ea;

    --fg1:        #1f2419;
    --fg2:        #5a5f55;
    --fg3:        #888888;
    --fg-on-dark: #f9f6f2;

    --border:         rgba(42,58,37,.14);
    --border-soft:    rgba(42,58,37,.08);
    --border-on-dark: rgba(255,255,255,0.18);

    --success-bg: #eaf3de; --success-text: #27500A; --success-border: #97C459;
    --warn-bg:    #faeeda; --warn-text:    #633806; --warn-border:    #EF9F27;
    --info-bg:    #E6F1FB; --info-text:    #0C447C; --info-border:    #85B7EB;
    --danger-bg:  #FCEBEB; --danger-text:  #791F1F; --danger-border:  #F09595;

    --glass-bg:        rgba(255,255,255,.72);
    --glass-bg-soft:   rgba(255,255,255,.55);
    --glass-bg-strong: rgba(255,255,255,.90);
    --glass-border:    rgba(255,255,255,.75);
    --glass-highlight: rgba(255,255,255,.7);
    --topbar-bg:       rgba(42,58,37,.86);
    --overlay-grad: linear-gradient(to bottom, rgba(42,58,37,.62) 0px, rgba(42,58,37,.42) 220px, rgba(249,246,242,.70) 460px, rgba(249,246,242,.86) 100%);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:      #141714;
      --bg-alt:  #1a1f19;
      --card:    #1e231d;
      --raised:  #262c25;
      --fg1:        #f1eee7;
      --fg2:        #b9bcb2;
      --fg3:        #8b9086;
      --border:         rgba(249,246,242,.14);
      --border-soft:    rgba(249,246,242,.08);
      --ttc-orange:     #e0782f;
      --ttc-orange-dk:  #b8621f;
      --success-bg: rgba(151,196,89,.14); --success-text: #9ed97a; --success-border: #6fae46;
      --warn-bg:    rgba(239,159,39,.14); --warn-text:    #f0c674; --warn-border:    #c98a2c;
      --info-bg:    rgba(133,183,235,.14); --info-text:   #8ec2f2; --info-border:   #5f9bd6;
      --danger-bg:  rgba(240,149,149,.14); --danger-text: #f2a3a3; --danger-border: #c96f6f;
      --glass-bg:        rgba(38,44,37,.72);
      --glass-bg-soft:   rgba(38,44,37,.55);
      --glass-bg-strong: rgba(30,35,29,.92);
      --glass-border:    rgba(249,246,242,.14);
      --glass-highlight: rgba(255,255,255,.08);
      --topbar-bg:       rgba(15,18,14,.90);
      --overlay-grad: linear-gradient(to bottom, rgba(0,0,0,.72) 0px, rgba(0,0,0,.55) 220px, rgba(20,23,20,.78) 460px, rgba(20,23,20,.94) 100%);
    }
  }
  :root[data-theme="dark"] {
    --bg:      #141714;
    --bg-alt:  #1a1f19;
    --card:    #1e231d;
    --raised:  #262c25;
    --fg1:        #f1eee7;
    --fg2:        #b9bcb2;
    --fg3:        #8b9086;
    --border:         rgba(249,246,242,.14);
    --border-soft:    rgba(249,246,242,.08);
    --ttc-orange:     #e0782f;
    --ttc-orange-dk:  #b8621f;
    --success-bg: rgba(151,196,89,.14); --success-text: #9ed97a; --success-border: #6fae46;
    --warn-bg:    rgba(239,159,39,.14); --warn-text:    #f0c674; --warn-border:    #c98a2c;
    --info-bg:    rgba(133,183,235,.14); --info-text:   #8ec2f2; --info-border:   #5f9bd6;
    --danger-bg:  rgba(240,149,149,.14); --danger-text: #f2a3a3; --danger-border: #c96f6f;
    --glass-bg:        rgba(38,44,37,.72);
    --glass-bg-soft:   rgba(38,44,37,.55);
    --glass-bg-strong: rgba(30,35,29,.92);
    --glass-border:    rgba(249,246,242,.14);
    --glass-highlight: rgba(255,255,255,.08);
    --topbar-bg:       rgba(15,18,14,.90);
    --overlay-grad: linear-gradient(to bottom, rgba(0,0,0,.72) 0px, rgba(0,0,0,.55) 220px, rgba(20,23,20,.78) 460px, rgba(20,23,20,.94) 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg1);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    position: relative;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      var(--overlay-grad),
      url('../../assets/photos/ttc-0137.jpg');
    background-size: cover;
    background-position: center 28%;
    background-repeat: no-repeat;
  }
  a { text-decoration: none; color: inherit; }
  svg { display: block; }
  button { font-family: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--ttc-orange);
    outline-offset: 2px;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

  /* ---- Top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center;
    height: calc(56px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: var(--topbar-bg);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    color: var(--fg-on-dark);
  }
  .topbar-back {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 56px; flex-shrink: 0; color: var(--fg-on-dark);
  }
  .topbar-back svg { width: 22px; height: 22px; }
  .topbar-title {
    flex: 1; text-align: center; font-weight: 600; font-size: 17px;
    padding-right: 48px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  main { padding: 20px 20px 8px; }
  main.contacts-main { padding: 10px 14px 8px; }

  /* ---- Contacts hint line ---- */
  .contacts-hint {
    margin: 0 2px 10px; font-size: 12px; line-height: 1.4; color: var(--fg2);
  }

  /* ---- Glass card (shared look) ---- */
  .glass-card {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(42,58,37,.08), 0 12px 32px rgba(42,58,37,.14), inset 0 1px 0 var(--glass-highlight);
  }
  @supports not (backdrop-filter: blur(1px)) {
    .glass-card { background: var(--glass-bg-strong); }
  }

  /* ---- Code gate ---- */
  .gate h2 { margin: 0 0 8px; font-size: 19px; font-weight: 700; color: var(--fg1); }
  .gate p.gate-hint { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: var(--fg2); }
  .code-input {
    width: 100%; height: 56px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 26px; font-weight: 600; letter-spacing: .08em; text-align: center;
    color: var(--fg1); font-family: inherit;
  }
  .gate-error {
    margin: 10px 0 0; font-size: 13.5px; color: var(--danger-text);
  }
  .btn-orange {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 56px; margin-top: 14px;
    border: none; border-radius: 14px; cursor: pointer;
    background: var(--ttc-orange); color: var(--fg-on-dark);
    font-weight: 700; font-size: 16px; font-family: inherit;
    transition: background-color .16s ease-out, transform .16s ease-out;
  }
  .btn-orange:active { background: var(--ttc-orange-dk); transform: translateY(1px); }
  .btn-orange:disabled { opacity: .6; }

  /* ---- Status line ---- */
  .status-line {
    text-align: center; font-size: 11.5px; color: var(--fg2);
    margin: 0 0 8px;
  }
  .status-line.status-warn { color: var(--warn-text); }

  /* ---- Loading / error text ---- */
  .quiet-line, .error-line {
    text-align: center; font-size: 14.5px; color: var(--fg2);
    padding: 24px 8px;
  }
  .error-line { color: var(--danger-text); }
  .retry-note {
    text-align: center; font-size: 13px; color: var(--fg2);
    margin: 0; padding: 0 8px 24px;
  }
  .gate-retry-line {
    margin: 10px 0 0; font-size: 13px; color: var(--fg2); text-align: center;
  }

  /* ---- Contact list (compact rows) ---- */
  .contact-list { margin: 0 0 4px; }

  .c-row {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(42,58,37,.08), 0 6px 16px rgba(42,58,37,.10), inset 0 1px 0 var(--glass-highlight);
    overflow: hidden;
  }
  @supports not (backdrop-filter: blur(1px)) {
    .c-row { background: var(--glass-bg-strong); }
  }

  .c-row-head {
    display: flex; align-items: center; gap: 10px;
    min-height: 64px; padding: 8px 10px 8px 14px;
  }
  .c-row-info {
    flex: 1; min-width: 0; padding: 4px 0; cursor: pointer;
  }
  .c-row-name {
    margin: 0; font-weight: 600; font-size: 16px; line-height: 1.25; color: var(--fg1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .c-row-sub {
    margin: 2px 0 0; font-size: 12.5px; line-height: 1.25; color: var(--fg3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .c-row-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    flex-shrink: 0; height: 48px; min-width: 118px; padding: 0 14px;
    border-radius: 12px; border: none;
    background: var(--ttc-orange); color: var(--fg-on-dark);
    font-weight: 700; font-size: 14.5px; font-family: inherit; text-align: center;
    transition: transform .16s ease-out;
  }
  .c-row-btn:active { transform: translateY(1px); }
  .c-row-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .c-row-btn[aria-disabled="true"] { opacity: .5; }

  .c-row-expand {
    padding: 2px 14px 14px;
    border-top: 1px solid var(--border-soft);
    margin: 0 10px;
  }
  .c-exp-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border-soft);
  }
  .c-exp-item:last-child { border-bottom: none; }
  .c-exp-info { flex: 1; min-width: 0; }
  .c-exp-name { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--fg1); }
  .c-exp-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
  .c-exp-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; min-width: 110px; padding: 0 14px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--glass-bg-soft); color: var(--fg1);
    font-weight: 600; font-size: 13.5px; font-family: inherit;
    transition: transform .16s ease-out;
  }
  .c-exp-btn:active { transform: translateY(1px); }
  .c-exp-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .c-exp-number { margin: 0; font-size: 12px; color: var(--fg2); }
  .c-exp-plain { margin: 0; font-size: 13px; color: var(--fg2); }

  /* ---- Footer ---- */
  .footer {
    text-align: center; font-size: 13px; color: var(--fg3);
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .footer a { color: var(--fg2); text-decoration: underline; }
  .footer p { margin: 0 0 10px; line-height: 1.5; }
  .forget-link { display: inline-block; margin-top: 4px; font-size: 12.5px; }

  .retry-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 20px; margin-top: 6px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: var(--fg1);
    font-weight: 600; font-size: 14.5px; font-family: inherit; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-orange, .c-row-btn, .c-exp-btn { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="topbar-back" href="../../" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="topbar-title">Crew Emergency Contacts</div>
  </div>
  <main id="main"></main>
</div>

<script>
(function () {
  'use strict';

  var BASE_URL = 'https://script.google.com/macros/s/AKfycbwFLYvp9TH35UjColkwFff0ArONQrT_l-WbG8cFBzS-O0wryMX5PzVBFeBlioHvJz0mZw/exec';
  var CODE_KEY = 'ttc-crew-code';
  var CACHE_KEY = 'ttc-crew-contacts-cache';

  var main = document.getElementById('main');
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); node.className = ''; }

  // ---- ?k= convenience: read it, store it, then strip it from the URL bar ----
  (function pickUpQueryCode() {
    try {
      var q = new URLSearchParams(location.search);
      var k = q.get('k');
      if (k && /^[0-9]+$/.test(k)) {
        localStorage.setItem(CODE_KEY, k);
        q.delete('k');
        var rest = q.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      }
    } catch (e) {}
  })();

  function getStoredCode() {
    try { return localStorage.getItem(CODE_KEY) || ''; } catch (e) { return ''; }
  }
  function storeCode(code) {
    try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
  }
  function clearCode() {
    try { localStorage.removeItem(CODE_KEY); } catch (e) {}
  }
  function getCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function setCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function digitsOnly(s) { return (s || '').toString().replace(/[^0-9+]/g, ''); }

  function phoneIcon() {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z');
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', 'currentColor');
    p.setAttribute('stroke-width', '1.75');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    s.appendChild(p);
    return s;
  }

  function timeAgo(iso) {
    if (!iso) return null;
    var then = new Date(iso).getTime();
    if (isNaN(then)) return null;
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins <= 1) return 'Updated just now';
    if (mins < 60) return 'Updated ' + mins + ' minutes ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return 'Updated ' + hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.round(hrs / 24);
    return 'Updated ' + days + (days === 1 ? ' day ago' : ' days ago');
  }

  function formatWhen(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try {
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  // ================= Views =================

  function renderGate(errorMsg) {
    clear(main);
    var card = document.createElement('div');
    card.className = 'glass-card gate';

    var h2 = document.createElement('h2');
    h2.textContent = 'Enter the crew code';
    card.appendChild(h2);

    var hint = document.createElement('p');
    hint.className = 'gate-hint';
    hint.textContent = 'Ask Joseph or David for it. Your phone remembers it after the first time.';
    card.appendChild(hint);

    var input = document.createElement('input');
    input.className = 'code-input';
    input.type = 'text';
    input.autocomplete = 'off';
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Crew code');
    card.appendChild(input);

    var errLine = document.createElement('p');
    errLine.className = 'gate-error';
    errLine.hidden = true;
    errLine.textContent = 'That code did not match. Try again.';
    if (errorMsg === 'code') errLine.hidden = false;
    card.appendChild(errLine);

    var btn = document.createElement('button');
    btn.className = 'btn-orange';
    btn.type = 'button';
    btn.textContent = 'Open Contacts';
    card.appendChild(btn);

    var retryLine = document.createElement('p');
    retryLine.className = 'gate-retry-line';
    retryLine.hidden = true;
    retryLine.textContent = 'Still loading, Google is slow right now.';
    card.appendChild(retryLine);

    main.appendChild(card);

    function submit() {
      var code = (input.value || '').trim();
      if (!code) return;
      errLine.hidden = true;
      retryLine.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Checking...';
      loadContacts(code, function (result) {
        btn.disabled = false;
        btn.textContent = 'Open Contacts';
        retryLine.hidden = true;
        if (result.ok) {
          storeCode(code);
          renderContacts(result.data, false);
        } else if (result.error === 'code') {
          errLine.hidden = false;
          input.focus();
        } else if (result.error === 'setup') {
          renderSetupError();
        } else {
          renderNetworkError(code);
        }
      }, function onRetrying() {
        retryLine.hidden = false;
      });
    }

    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submit();
    });
    input.focus();
  }

  function renderLoading() {
    clear(main);
    var p = document.createElement('p');
    p.className = 'quiet-line';
    p.textContent = 'Loading the latest list.';
    main.appendChild(p);
    var retryNote = document.createElement('p');
    retryNote.className = 'retry-note';
    retryNote.id = 'loading-retry-note';
    retryNote.hidden = true;
    retryNote.textContent = 'Still loading, Google is slow right now.';
    main.appendChild(retryNote);
  }

  function showLoadingRetryNote() {
    var el = document.getElementById('loading-retry-note');
    if (el) el.hidden = false;
  }

  function renderSetupError() {
    clear(main);
    var p = document.createElement('p');
    p.className = 'error-line';
    p.textContent = 'The contacts tab is not set up yet. Tell Joseph.';
    main.appendChild(p);
  }

  function renderNetworkError(code) {
    clear(main);
    var p = document.createElement('p');
    p.className = 'error-line';
    p.textContent = 'Could not reach the sheet. Check your signal and try again.';
    main.appendChild(p);
    var retry = document.createElement('div');
    retry.style.textAlign = 'center';
    var btn = document.createElement('button');
    btn.className = 'retry-btn';
    btn.type = 'button';
    btn.textContent = 'Retry';
    btn.addEventListener('click', function () {
      renderLoading();
      loadContacts(code, function (result) {
        if (result.ok) renderContacts(result.data, false);
        else if (result.error === 'code') renderGate('code');
        else if (result.error === 'setup') renderSetupError();
        else renderNetworkError(code);
      }, showLoadingRetryNote);
    });
    retry.appendChild(btn);
    main.appendChild(retry);
  }

  // Only one row's expansion open at a time. Reset per renderContacts() call.
  var openRow = null;
  function collapseOpenRow() {
    if (openRow) {
      openRow.expansion.hidden = true;
      openRow.info.setAttribute('aria-expanded', 'false');
      openRow.row.classList.remove('c-row-open');
      openRow = null;
    }
  }

  function buildExpansion(person) {
    var wrap = document.createElement('div');
    wrap.className = 'c-row-expand';
    wrap.hidden = true;

    // 1. the person's own number.
    if (person.phone) {
      var item = document.createElement('div');
      item.className = 'c-exp-item';
      var info = document.createElement('div');
      info.className = 'c-exp-info';
      var label = document.createElement('p');
      label.className = 'c-exp-name';
      label.textContent = (person.firstName || 'Their') + ' own number';
      info.appendChild(label);
      item.appendChild(info);
      var col = document.createElement('div');
      col.className = 'c-exp-col';
      var btn = document.createElement('a');
      btn.className = 'c-exp-btn';
      btn.href = 'tel:' + digitsOnly(person.phone);
      btn.appendChild(phoneIcon());
      var lbl = document.createElement('span');
      lbl.textContent = 'Call ' + (person.firstName || 'them');
      btn.appendChild(lbl);
      col.appendChild(btn);
      var num = document.createElement('p');
      num.className = 'c-exp-number';
      num.textContent = person.phone;
      col.appendChild(num);
      item.appendChild(col);
      wrap.appendChild(item);
    }

    // 2. the second emergency contact, if any.
    if (person.secondContact || person.secondPhone) {
      var item2 = document.createElement('div');
      item2.className = 'c-exp-item';
      var info2 = document.createElement('div');
      info2.className = 'c-exp-info';
      if (person.secondContact) {
        var n2 = document.createElement('p');
        n2.className = 'c-exp-name';
        n2.textContent = person.secondContact + (person.secondRelationship ? ', ' + person.secondRelationship : '');
        info2.appendChild(n2);
      }
      item2.appendChild(info2);
      if (person.secondPhone) {
        var col2 = document.createElement('div');
        col2.className = 'c-exp-col';
        var btn2 = document.createElement('a');
        btn2.className = 'c-exp-btn';
        btn2.href = 'tel:' + digitsOnly(person.secondPhone);
        btn2.appendChild(phoneIcon());
        var lbl2 = document.createElement('span');
        lbl2.textContent = 'Call';
        btn2.appendChild(lbl2);
        col2.appendChild(btn2);
        var num2 = document.createElement('p');
        num2.className = 'c-exp-number';
        num2.textContent = person.secondPhone;
        col2.appendChild(num2);
        item2.appendChild(col2);
      }
      wrap.appendChild(item2);
    }

    // 3. the (first) emergency contact's number, written out.
    if (person.emergencyPhone) {
      var item3 = document.createElement('div');
      item3.className = 'c-exp-item';
      var p3 = document.createElement('p');
      p3.className = 'c-exp-plain';
      p3.textContent = (person.emergencyContact || 'Emergency contact') + ': ' + person.emergencyPhone;
      item3.appendChild(p3);
      wrap.appendChild(item3);
    }

    return wrap;
  }

  function buildContactRow(person) {
    var row = document.createElement('div');
    row.className = 'c-row';

    var head = document.createElement('div');
    head.className = 'c-row-head';

    var info = document.createElement('div');
    info.className = 'c-row-info';
    info.setAttribute('role', 'button');
    info.setAttribute('tabindex', '0');
    info.setAttribute('aria-expanded', 'false');

    var name = document.createElement('p');
    name.className = 'c-row-name';
    name.textContent = ((person.firstName || '') + ' ' + (person.lastName || '')).trim();
    info.appendChild(name);

    var sub = document.createElement('p');
    sub.className = 'c-row-sub';
    var subText = person.emergencyContact || '';
    if (person.relationship) subText += (subText ? ', ' : '') + person.relationship;
    sub.textContent = subText || 'No emergency contact on file';
    info.appendChild(sub);

    head.appendChild(info);

    var ephone = person.emergencyPhone || '';
    var callFirst = person.emergencyContact ? person.emergencyContact.split(' ')[0] : '';
    var btn = document.createElement(ephone ? 'a' : 'span');
    btn.className = 'c-row-btn';
    if (ephone) {
      btn.href = 'tel:' + digitsOnly(ephone);
    } else {
      btn.setAttribute('aria-disabled', 'true');
    }
    btn.appendChild(phoneIcon());
    var btnLbl = document.createElement('span');
    btnLbl.textContent = 'Call ' + (callFirst || 'contact');
    btn.appendChild(btnLbl);
    head.appendChild(btn);

    row.appendChild(head);

    var expansion = buildExpansion(person);
    row.appendChild(expansion);

    function toggle() {
      var isOpen = !expansion.hidden;
      collapseOpenRow();
      if (!isOpen) {
        expansion.hidden = false;
        info.setAttribute('aria-expanded', 'true');
        row.classList.add('c-row-open');
        openRow = { row: row, expansion: expansion, info: info };
      }
    }

    info.addEventListener('click', toggle);
    info.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });

    return row;
  }

  function renderContacts(data, fromCacheOnly) {
    clear(main);
    main.className = 'contacts-main';
    openRow = null;

    var hint = document.createElement('p');
    hint.className = 'contacts-hint';
    hint.textContent = "Tap the orange button to reach that person's emergency contact. Tap the name for more numbers.";
    main.appendChild(hint);

    var status = document.createElement('p');
    status.className = 'status-line';
    if (fromCacheOnly) {
      status.className = 'status-line status-warn';
      status.textContent = 'Could not reach the sheet. Showing the list from ' + formatWhen(data.updatedAt) + '.';
    } else {
      status.textContent = timeAgo(data.updatedAt) || '';
    }
    main.appendChild(status);

    var list = data.contacts || [];
    var listWrap = document.createElement('div');
    listWrap.className = 'contact-list';
    list.forEach(function (person) {
      listWrap.appendChild(buildContactRow(person));
    });
    main.appendChild(listWrap);

    var footer = document.createElement('div');
    footer.className = 'footer';
    var p1 = document.createElement('p');
    p1.textContent = 'Edited by the office in the Google Sheet. Updated on every open.';
    footer.appendChild(p1);
    if (data.sheetUrl) {
      var sheetLink = document.createElement('a');
      sheetLink.href = data.sheetUrl;
      sheetLink.target = '_blank';
      sheetLink.rel = 'noopener';
      sheetLink.textContent = 'Open the sheet';
      footer.appendChild(sheetLink);
    }
    var forget = document.createElement('a');
    forget.className = 'forget-link';
    forget.href = '#';
    forget.textContent = 'Forget the code on this phone';
    forget.style.display = 'block';
    forget.addEventListener('click', function (e) {
      e.preventDefault();
      clearCode();
      try { localStorage.removeItem(CACHE_KEY); } catch (err) {}
      renderGate();
    });
    footer.appendChild(forget);
    main.appendChild(footer);
  }

  // ---- Network ----
  // Google intermittently answers this endpoint with an HTML error page ("Sorry, unable to
  // open the file at this time") instead of JSON, even for a correct request. Treat anything
  // that doesn't parse as a well-formed JSON response as transient and retry with backoff,
  // adding a cache-buster each time. A well-formed JSON answer (including a wrong-code answer)
  // is never retried — it's a real answer from the server, not a Google hiccup.
  var RETRY_DELAYS_MS = [1500, 3000, 6000, 10000];

  function attemptFetch(code, attemptIndex, cb, onRetrying) {
    var url = BASE_URL + '?format=json&k=' + encodeURIComponent(String(code).trim().toLowerCase());
    if (attemptIndex > 0) url += '&t=' + Date.now();

    fetch(url, { redirect: 'follow', credentials: 'omit' })
      .then(function (res) {
        return res.text().then(function (text) {
          var data;
          try { data = JSON.parse(text); } catch (e) { data = null; }
          if (!data || typeof data !== 'object' || typeof data.ok !== 'boolean') {
            // Not a real answer (e.g. Google's HTML error page) — treat as transient.
            var err = new Error('bad-response');
            throw err;
          }
          return data;
        });
      })
      .then(function (data) {
        if (data.ok) {
          setCache(data);
          cb({ ok: true, data: data });
        } else if (data.error === 'code' || data.error === 'setup') {
          cb({ ok: false, error: data.error });
        } else {
          cb({ ok: false, error: 'network' });
        }
      })
      .catch(function () {
        if (attemptIndex < RETRY_DELAYS_MS.length) {
          if (onRetrying) onRetrying(attemptIndex);
          setTimeout(function () {
            attemptFetch(code, attemptIndex + 1, cb, onRetrying);
          }, RETRY_DELAYS_MS[attemptIndex]);
        } else {
          cb({ ok: false, error: 'network' });
        }
      });
  }

  function loadContacts(code, cb, onRetrying) {
    attemptFetch(code, 0, cb, onRetrying);
  }

  // ================= Boot =================
  var storedCode = getStoredCode();
  var cache = getCache();

  if (!storedCode) {
    if (cache) {
      // Shouldn't normally happen (cache implies a code worked before), but if the code was
      // forgotten while a cache remains, still ask for the code before showing anything.
    }
    renderGate();
  } else if (cache) {
    renderContacts(cache, false);
    loadContacts(storedCode, function (result) {
      if (result.ok) {
        renderContacts(result.data, false);
      } else if (result.error === 'code') {
        renderGate('code');
      } else if (result.error === 'setup') {
        renderSetupError();
      } else {
        renderContacts(cache, true);
      }
    });
  } else {
    renderLoading();
    loadContacts(storedCode, function (result) {
      if (result.ok) {
        renderContacts(result.data, false);
      } else if (result.error === 'code') {
        renderGate('code');
      } else if (result.error === 'setup') {
        renderSetupError();
      } else {
        renderNetworkError(storedCode);
      }
    }, showLoadingRetryNote);
  }

})();
</script>
<script defer src="../../shared/profile-button.js"></script>
</body>
