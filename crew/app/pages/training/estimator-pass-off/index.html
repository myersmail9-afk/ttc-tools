<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a3a25">
<title>Qualified Estimator Pass-Off — TTC Crew</title>
<!-- KIT: pre-paint. Must be inline and first. Do not move to shared/. -->
<script>(function(){try{var t=localStorage.getItem('ttc-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>html{background:#f9f6f2}@media(prefers-color-scheme:dark){html:not([data-theme="light"]){background:#1b2218}}html[data-theme="dark"]{background:#1b2218}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ttc-orange:#C9601A; --ttc-orange-dk:#a14d14; --ttc-green:#4a6741; --ttc-dark:#2a3a25; --ttc-gold:#f0c080;
    --bg:#f9f6f2; --bg-alt:#f1ece4; --card:#ffffff; --card-2:#fbf9f6;
    --fg1:#1f2419; --fg2:#5a5f55; --fg3:#8b8f86;
    --border:rgba(42,58,37,0.14); --border-soft:rgba(42,58,37,0.07);
    --rail:#e6e0d6;
    --open-bg:#f1ece4; --open-fg:#6b6f66;
    --claim-bg:#faeeda; --claim-fg:#633806; --claim-br:#EF9F27;
    --ver-bg:#eaf3de;  --ver-fg:#27500A;  --ver-br:#97C459;
    --ret-bg:#FCEBEB;  --ret-fg:#791F1F;  --ret-br:#F09595;
    --shadow:0 1px 2px rgba(42,58,37,.06),0 8px 24px rgba(42,58,37,.06);
    --fs:16px;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#1b2218; --bg-alt:#222b1e; --card:#26301f; --card-2:#2b3624;
    --fg1:#f1eee7; --fg2:#b9bcb2; --fg3:#858a7e;
    --border:rgba(249,246,242,.16); --border-soft:rgba(249,246,242,.08); --rail:#36432d;
    --open-bg:#2b3624; --open-fg:#9aa091;
    --claim-bg:#3d2d12; --claim-fg:#f3cd8e; --claim-br:#a9762a;
    --ver-bg:#22381a;  --ver-fg:#c6e3a3;  --ver-br:#4f7a37;
    --ret-bg:#3e1d1d;  --ret-fg:#f0a5a5;  --ret-br:#8d4141;
    --ttc-orange:#e0782f; --ttc-gold:#d9ad6f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }}
  :root[data-theme="dark"]{
    --bg:#1b2218; --bg-alt:#222b1e; --card:#26301f; --card-2:#2b3624;
    --fg1:#f1eee7; --fg2:#b9bcb2; --fg3:#858a7e;
    --border:rgba(249,246,242,.16); --border-soft:rgba(249,246,242,.08); --rail:#36432d;
    --open-bg:#2b3624; --open-fg:#9aa091;
    --claim-bg:#3d2d12; --claim-fg:#f3cd8e; --claim-br:#a9762a;
    --ver-bg:#22381a;  --ver-fg:#c6e3a3;  --ver-br:#4f7a37;
    --ret-bg:#3e1d1d;  --ret-fg:#f0a5a5;  --ret-br:#8d4141;
    --ttc-orange:#e0782f; --ttc-gold:#d9ad6f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
  :root[data-textsize="big"]{--fs:18.5px}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg1);font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
       font-size:var(--fs);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  a{text-decoration:none;color:inherit} svg{display:block}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ttc-orange);outline-offset:2px;border-radius:6px}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
          padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
          background:var(--ttc-dark);color:#f1eee7}
  .topbar-back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 auto}
  .topbar-back svg{width:22px;height:22px}
  .topbar-title{flex:1;font-size:15px;font-weight:600;text-align:center;margin-right:34px}
  .icon-btn{background:none;border:0;padding:6px 8px;cursor:pointer;font-weight:700;font-size:14px;opacity:.9}

  .wrap{max-width:780px;margin:0 auto;padding:18px 16px 90px}

  /* ---- header ---- */
  .doc-head{text-align:center;padding:10px 0 4px}
  .doc-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ttc-green);margin:0 0 8px}
  h1{font-size:clamp(25px,5.4vw,33px);line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
  .doc-sub{font-size:13.5px;color:var(--fg2);margin:0 0 4px}

  /* ---- who ---- */
  .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);
       border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin:16px 0}
  .who-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);font-weight:700}
  .who select,.who input{font:inherit;font-size:15px;background:var(--bg-alt);color:var(--fg1);
       border:1px solid var(--border);border-radius:9px;padding:7px 10px;min-width:150px}
  .who-note{flex-basis:100%;font-size:12.5px;color:var(--fg3);margin:0}

  /* ---- tier rail ---- */
  .rail{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 16px 12px;
        box-shadow:var(--shadow);margin:0 0 18px}
  .rail-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
  .rail-now{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);font-weight:700}
  .rail-tier{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ttc-orange)}
  .rail-track{display:flex;gap:5px}
  .rail-seg{flex:1;min-width:0}
  .rail-bar{height:7px;border-radius:99px;background:var(--rail);overflow:hidden}
  .rail-bar i{display:block;height:100%;background:var(--ttc-green);border-radius:99px;transition:width .35s ease}
  .rail-seg.done .rail-bar i{background:var(--ver-br)}
  .rail-name{font-size:10.5px;color:var(--fg3);margin-top:6px;text-align:center;line-height:1.25;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail-seg.cur .rail-name{color:var(--ttc-orange);font-weight:700}
  .rail-foot{font-size:12.5px;color:var(--fg2);margin:12px 0 0;text-align:center}

  /* ---- generic blocks (verbatim content) ---- */
  .blocks p{margin:0 0 10px}
  .blocks h4{font-size:14.5px;font-weight:700;margin:16px 0 6px}
  .blocks ul,.blocks ol{margin:0 0 10px;padding-left:22px}
  .blocks li{margin-bottom:5px}
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card);margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--border-soft);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);font-weight:700;background:var(--bg-alt)}
  tr:last-child td{border-bottom:0}
  .note-block{border-left:3px solid var(--ttc-gold);padding:2px 0 2px 13px;margin:0 0 12px;color:var(--fg2)}

  /* ---- level ---- */
  .level{margin:0 0 14px;border:1px solid var(--border);border-radius:16px;background:var(--card);
         box-shadow:var(--shadow);overflow:hidden}
  .level.is-endorsement{border-style:dashed}
  .level-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card-2);
              border-bottom:1px solid var(--border-soft);cursor:pointer;width:100%;border:0;text-align:left}
  .level-ord{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
             background:var(--ttc-dark);color:#f1eee7;font-size:13px;font-weight:800}
  .level.is-done .level-ord{background:var(--ver-br);color:#12280a}
  .level-titles{flex:1;min-width:0}
  .level-title{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .level-kind{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:700;margin-top:2px}
  .level-count{flex:0 0 auto;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;text-align:right}
  .level-count b{display:block;font-size:15px;color:var(--fg1)}
  .level-chev{flex:0 0 auto;transition:transform .2s ease;color:var(--fg3)}
  .level[open] .level-chev,.level.is-open .level-chev{transform:rotate(90deg)}
  .level-bar{height:4px;background:var(--rail)}
  .level-bar i{display:block;height:100%;background:var(--ttc-green);transition:width .35s ease}
  .level-body{padding:14px 16px 6px;display:none}
  .level.is-open .level-body{display:block}
  .level-purpose{font-size:14.5px;color:var(--fg2);margin:0 0 12px}

  /* ---- section ---- */
  .sect{margin:0 0 16px}
  .sect-head{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
  .sect-title{font-size:14px;font-weight:800;color:var(--ttc-orange);letter-spacing:.01em;flex:1}
  .sect-count{font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
  .sect-count.all-done{color:var(--ver-fg);font-weight:700}

  /* ---- item ---- */
  .item{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border-soft);
        border-radius:12px;background:var(--bg-alt);margin:0 0 7px;transition:border-color .2s,background .2s}
  .item[data-state="claimed"]{background:var(--claim-bg);border-color:var(--claim-br)}
  .item[data-state="verified"]{background:var(--ver-bg);border-color:var(--ver-br)}
  .item[data-state="returned"]{background:var(--ret-bg);border-color:var(--ret-br)}
  .item-mark{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--border);
             background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;margin-top:1px}
  .item-mark svg{width:15px;height:15px;opacity:0}
  .item[data-state="claimed"] .item-mark{border-color:var(--claim-br)}
  .item[data-state="claimed"] .item-mark svg{opacity:1;color:var(--claim-fg)}
  .item[data-state="verified"] .item-mark{border-color:var(--ver-br);background:var(--ver-br)}
  .item[data-state="verified"] .item-mark svg{opacity:1;color:#12280a}
  .item[data-state="returned"] .item-mark{border-color:var(--ret-br)}
  .item[data-state="returned"] .item-mark svg{opacity:1;color:var(--ret-fg)}
  .item-body{flex:1;min-width:0}
  .item-text{font-size:14.5px;line-height:1.5}
  .item-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
  .chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;
        background:var(--open-bg);color:var(--open-fg);white-space:nowrap}
  .chip.claimed{background:var(--claim-bg);color:var(--claim-fg)}
  .chip.verified{background:var(--ver-bg);color:var(--ver-fg)}
  .chip.returned{background:var(--ret-bg);color:var(--ret-fg)}
  .item-when{font-size:11.5px;color:var(--fg3)}
  .item-note{font-size:13px;color:var(--fg2);margin-top:6px;padding:7px 10px;background:var(--card);
             border-radius:9px;border:1px solid var(--border-soft)}
  .item-note b{font-weight:700;color:var(--fg1)}
  .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .btn{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:9px;border:1px solid var(--border);
       background:var(--card);cursor:pointer}
  .btn.primary{background:var(--ttc-orange);border-color:var(--ttc-orange);color:#fff}
  .btn.good{background:var(--ver-br);border-color:var(--ver-br);color:#12280a}
  .btn.bad{background:var(--card);border-color:var(--ret-br);color:var(--ret-fg)}

  /* ---- sign-off ---- */
  .signoff{margin:14px 0 4px;border:2px solid var(--ttc-gold);border-radius:14px;background:var(--card);overflow:hidden}
  .signoff-head{padding:10px 14px;background:var(--ttc-gold);color:#3a2a10;font-size:13px;font-weight:800;
                letter-spacing:.06em;text-transform:uppercase}
  .signoff-body{padding:13px 14px 6px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:10px}
  .field{border:1px dashed var(--border);border-radius:9px;padding:8px 10px}
  .field-label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:700}
  .field-line{height:18px;border-bottom:1px solid var(--border);margin-top:3px}

  /* ---- appendix ---- */
  details.appx{border:1px solid var(--border);border-radius:14px;background:var(--card);margin:0 0 10px;
               box-shadow:var(--shadow);overflow:hidden}
  details.appx>summary{padding:13px 16px;cursor:pointer;font-weight:800;font-size:15px;list-style:none}
  details.appx>summary::-webkit-details-marker{display:none}
  details.appx>summary::after{content:'›';float:right;color:var(--fg3);transition:transform .2s}
  details.appx[open]>summary::after{transform:rotate(90deg)}
  .appx-body{padding:0 16px 14px}

  h2.part{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:800;
          margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--border-soft)}

  .foot{margin-top:30px;padding-top:15px;border-top:1px solid var(--border);font-size:12.5px;color:var(--fg3);text-align:center}
  .foot a{color:var(--ttc-orange);font-weight:600}
  .loading{padding:50px 10px;text-align:center;color:var(--fg3)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="../../../index.html#/reviews" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="topbar-title">Qualified Estimator Pass-Off</div>
  <button class="icon-btn" id="bigText" title="Bigger text">Aa</button>
</div>

<div class="wrap" id="root"><div class="loading">Loading the pass-off…</div></div>

<script src="../../../data/passoff.js"></script>
<script>
(function(){
  'use strict';
  var D = window.TTC_PASSOFF || null;
  var root = document.getElementById('root');

  /* ---------- text size ---------- */
  var TS='ttc-textsize';
  try{ if(localStorage.getItem(TS)==='big') document.documentElement.setAttribute('data-textsize','big'); }catch(e){}
  document.getElementById('bigText').addEventListener('click',function(){
    var on=document.documentElement.getAttribute('data-textsize')==='big';
    if(on) document.documentElement.removeAttribute('data-textsize');
    else document.documentElement.setAttribute('data-textsize','big');
    try{ localStorage.setItem(TS,on?'normal':'big'); }catch(e){}
  });

  /* ---------- records service ----------
     Local for now. When the Apps Script backend is deployed this object is the
     only thing that changes: same four calls, same shapes, network underneath.  */
  var KEY='ttc-passoff:v2';
  var Rec = {
    _s:null,
    load:function(){ if(this._s) return this._s;
      try{ this._s=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ this._s=null; }
      if(!this._s) this._s={people:{},current:null,viewer:null};
      return this._s; },
    save:function(){ try{ localStorage.setItem(KEY,JSON.stringify(this._s)); }catch(e){} },
    people:function(){ return Object.keys(this.load().people).sort(); },
    current:function(){ return this.load().current; },
    setCurrent:function(n){ var s=this.load(); n=(n||'').trim(); if(!n) return;
      if(!s.people[n]) s.people[n]={items:{}}; s.current=n; this.save(); },
    viewer:function(){ return this.load().viewer||'crew'; },
    setViewer:function(v){ var s=this.load(); s.viewer=v; this.save(); },
    all:function(){ var s=this.load(); var p=s.current&&s.people[s.current]; return p?p.items:{}; },
    get:function(id){ return this.all()[id]||{state:'open'}; },
    set:function(id,state,note){ var s=this.load(); if(!s.current) return null;
      var it={state:state,ts:new Date().toISOString(),by:s.viewer};
      if(note) it.note=note;
      var prev=s.people[s.current].items[id];
      if(prev&&prev.note&&state==='verified') it.claimNote=prev.note;
      if(prev&&prev.claimNote&&!it.claimNote) it.claimNote=prev.claimNote;
      s.people[s.current].items[id]=it; this.save(); return it; }
  };

  /* ---------- helpers ---------- */
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls;
    if(txt!=null)e.textContent=txt; return e; }
  function tick(){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor');
    s.setAttribute('stroke-width','3.2'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    var p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d','M20 6L9 17l-5-5'); s.appendChild(p); return s; }
  function chev(){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor');
    s.setAttribute('stroke-width','2.2'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    s.setAttribute('width','18'); s.setAttribute('height','18');
    var p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d','M9 18l6-6-6-6'); s.appendChild(p); return s; }
  function when(iso){ if(!iso) return ''; var d=new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  /* Render a verbatim block exactly as extracted. Never rewrite the text. */
  function blocks(list,host){
    (list||[]).forEach(function(b){
      if(!b) return;
      if(b.type==='p'||b.type==='note'){
        var p=el('p',b.type==='note'?'note-block':null);
        if(b.html) p.innerHTML=b.html; else p.textContent=b.text||'';
        host.appendChild(p);
      } else if(b.type==='h4'){ host.appendChild(el('h4',null,b.text||''));
      } else if(b.type==='ul'||b.type==='ol'){
        var l=el(b.type==='ul'?'ul':'ol');
        (b.items||[]).forEach(function(t){ l.appendChild(el('li',null,t)); }); host.appendChild(l);
      } else if(b.type==='table'){ host.appendChild(tableOf(b)); }
    });
  }
  function tableOf(b){
    var w=el('div','tablewrap'), t=el('table'), rows=b.rows||[];
    if(b.header&&rows.length){ var th=el('thead'),tr=el('tr');
      rows[0].forEach(function(c){ tr.appendChild(el('th',null,c)); }); th.appendChild(tr); t.appendChild(th); rows=rows.slice(1); }
    var tb=el('tbody');
    rows.forEach(function(r){ var tr=el('tr'); r.forEach(function(c){ tr.appendChild(el('td',null,c)); }); tb.appendChild(tr); });
    t.appendChild(tb); w.appendChild(t); return w;
  }

  /* ---------- item ---------- */
  function itemRow(it){
    var st=Rec.get(it.id), row=el('div','item'); row.setAttribute('data-state',st.state||'open');
    var mark=el('button','item-mark'); mark.appendChild(tick());
    mark.setAttribute('aria-label','Mark done'); row.appendChild(mark);

    var body=el('div','item-body'); row.appendChild(body);
    body.appendChild(el('div','item-text',it.text));

    var meta=el('div','item-meta');
    var label={open:'Not started',claimed:'Waiting on review',verified:'Verified',returned:'Needs another look'}[st.state||'open'];
    var chip=el('span','chip '+(st.state==='open'?'':st.state),label); meta.appendChild(chip);
    if(st.ts) meta.appendChild(el('span','item-when',when(st.ts)));
    body.appendChild(meta);

    if(st.claimNote){ var n1=el('div','item-note'); n1.appendChild(el('b',null,'Evidence: '));
      n1.appendChild(document.createTextNode(st.claimNote)); body.appendChild(n1); }
    if(st.note&&st.note!==st.claimNote){ var n2=el('div','item-note');
      n2.appendChild(el('b',null,st.state==='returned'?'Sent back: ':(st.state==='claimed'?'Evidence: ':'Note: ')));
      n2.appendChild(document.createTextNode(st.note)); body.appendChild(n2); }

    var act=el('div','act'), viewer=Rec.viewer();
    function re(){ var fresh=itemRow(it); row.parentNode.replaceChild(fresh,row); paintTotals(); }

    if(viewer==='crew'){
      if(st.state==='open'||st.state==='returned'){
        var b1=el('button','btn primary',st.state==='returned'?'Mark done again':'I have done this');
        b1.onclick=function(){ var note=prompt('Anything to show for it? (optional — a job number, a date, a note for David)','')||'';
          Rec.set(it.id,'claimed',note.trim()); re(); };
        act.appendChild(b1);
      } else if(st.state==='claimed'){
        var b2=el('button','btn','Undo');
        b2.onclick=function(){ Rec.set(it.id,'open',''); re(); }; act.appendChild(b2);
      }
    } else {
      if(st.state==='claimed'||st.state==='open'){
        var v=el('button','btn good','Verify');
        v.onclick=function(){ Rec.set(it.id,'verified',''); re(); }; act.appendChild(v);
      }
      if(st.state==='claimed'){
        var r=el('button','btn bad','Send back');
        r.onclick=function(){ var why=prompt('What still needs doing?','')||''; Rec.set(it.id,'returned',why.trim()); re(); };
        act.appendChild(r);
      }
      if(st.state==='verified'){
        var u=el('button','btn','Undo verify');
        u.onclick=function(){ Rec.set(it.id,'claimed',st.claimNote||''); re(); }; act.appendChild(u);
      }
    }
    mark.onclick=function(){ if(act.firstChild) act.firstChild.click(); };
    if(act.childNodes.length) body.appendChild(act);
    return row;
  }

  /* ---------- counting ---------- */
  function levelItems(L){
    var out=[];
    (L.sections||[]).forEach(function(s){ (s.items||[]).forEach(function(i){ out.push(i); }); });
    if(L.signoff&&L.signoff.items) L.signoff.items.forEach(function(i){ out.push(i); });
    return out;
  }
  function countOf(items){
    var v=0,c=0; items.forEach(function(i){ var s=Rec.get(i.id).state;
      if(s==='verified')v++; else if(s==='claimed')c++; });
    return {verified:v,claimed:c,total:items.length};
  }

  /* ---------- render ---------- */
  function render(){
    root.innerHTML='';
    if(!D){ var w=el('div','loading');
      w.textContent='The pass-off data file has not been generated yet (data/passoff.js).'; root.appendChild(w); return; }

    /* header */
    var h=el('div','doc-head');
    h.appendChild(el('p','doc-eyebrow','Total Tree Care'));
    h.appendChild(el('h1',null,D.title||'Qualified Estimator Pass-Off'));
    if(D.subtitle) h.appendChild(el('p','doc-sub',D.subtitle));
    root.appendChild(h);

    /* who + viewing as */
    var who=el('div','who');
    who.appendChild(el('span','who-label','Person'));
    var sel=el('select'); var people=Rec.people(), cur=Rec.current();
    people.forEach(function(n){ var o=el('option',null,n); o.value=n; if(n===cur)o.selected=true; sel.appendChild(o); });
    var addO=el('option',null,'+ Add a person…'); addO.value='__add'; sel.appendChild(addO);
    if(!people.length) sel.value='__add';
    sel.onchange=function(){
      if(sel.value==='__add'){ var n=prompt('Whose pass-off is this?','')||''; n=n.trim();
        if(n){ Rec.setCurrent(n); } render(); return; }
      Rec.setCurrent(sel.value); render();
    };
    who.appendChild(sel);
    who.appendChild(el('span','who-label','Viewing as'));
    var vsel=el('select');
    [['crew','The person'],['trainer','David or a trainer']].forEach(function(p){
      var o=el('option',null,p[1]); o.value=p[0]; if(Rec.viewer()===p[0])o.selected=true; vsel.appendChild(o); });
    vsel.onchange=function(){ Rec.setViewer(vsel.value); render(); };
    who.appendChild(vsel);
    who.appendChild(el('p','who-note','Saved on this device for now. Once the records backend is deployed, a person signs in with their email and David reviews from anywhere.'));
    root.appendChild(who);

    /* tier rail */
    var rail=el('div','rail'), rtop=el('div','rail-top');
    rtop.appendChild(el('span','rail-now','Standing at'));
    var tierName=el('span','rail-tier','—'); rtop.appendChild(tierName); rail.appendChild(rtop);
    var track=el('div','rail-track'); rail.appendChild(track);
    var rfoot=el('p','rail-foot',''); rail.appendChild(rfoot); root.appendChild(rail);

    /* intro */
    if(D.intro&&D.intro.length){ var ib=el('div','blocks'); blocks(D.intro,ib); root.appendChild(ib); }
    if(D.header_fields&&D.header_fields.length){
      var hf=el('div','fields');
      D.header_fields.forEach(function(f){ var d=el('div','field');
        d.appendChild(el('div','field-label',f.label)); d.appendChild(el('div','field-line')); hf.appendChild(d); });
      root.appendChild(hf);
    }

    root.appendChild(el('h2','part','The ladder'));

    /* levels */
    (D.levels||[]).forEach(function(L,idx){
      var items=levelItems(L), cnt=countOf(items);
      var box=el('div','level'+(L.kind==='endorsement'?' is-endorsement':'')+(cnt.verified===cnt.total&&cnt.total?' is-done':''));
      box.id='lvl-'+L.id;

      var head=el('button','level-head');
      var ord=el('div','level-ord',L.kind==='endorsement'?'★':String(idx+1)); head.appendChild(ord);
      var tt=el('div','level-titles');
      tt.appendChild(el('div','level-title',L.title));
      tt.appendChild(el('div','level-kind',L.kind==='endorsement'?'Specialty endorsement':'Tier'));
      head.appendChild(tt);
      var cc=el('div','level-count'); var b=el('b',null,cnt.verified+'/'+cnt.total);
      cc.appendChild(b); cc.appendChild(document.createTextNode(cnt.claimed?cnt.claimed+' waiting':'verified'));
      head.appendChild(cc);
      var ch=el('div','level-chev'); ch.appendChild(chev()); head.appendChild(ch);
      head.onclick=function(){ box.classList.toggle('is-open'); };
      box.appendChild(head);

      var bar=el('div','level-bar'), fill=el('i');
      fill.style.width=(cnt.total?Math.round(cnt.verified/cnt.total*100):0)+'%'; bar.appendChild(fill); box.appendChild(bar);

      var body=el('div','level-body');
      if(L.purpose) body.appendChild(el('p','level-purpose',L.purpose));
      if(L.meta_table) body.appendChild(tableOf(L.meta_table));

      (L.sections||[]).forEach(function(S){
        var sc=countOf(S.items||[]), sect=el('div','sect'), sh=el('div','sect-head');
        sh.appendChild(el('div','sect-title',S.title));
        sh.appendChild(el('div','sect-count'+(sc.verified===sc.total&&sc.total?' all-done':''),sc.verified+' of '+sc.total));
        sect.appendChild(sh);
        if(S.intro&&S.intro.length){ var si=el('div','blocks'); blocks(S.intro,si); sect.appendChild(si); }
        (S.items||[]).forEach(function(i){ sect.appendChild(itemRow(i)); });
        if(S.after&&S.after.length){ var sa=el('div','blocks'); blocks(S.after,sa); sect.appendChild(sa); }
        body.appendChild(sect);
      });

      if(L.signoff){
        var so=el('div','signoff');
        so.appendChild(el('div','signoff-head',L.signoff.title||'Sign-off'));
        var sb=el('div','signoff-body');
        if(L.signoff.intro&&L.signoff.intro.length){ var g=el('div','blocks'); blocks(L.signoff.intro,g); sb.appendChild(g); }
        (L.signoff.items||[]).forEach(function(i){ sb.appendChild(itemRow(i)); });
        if(L.signoff.fields&&L.signoff.fields.length){
          var ff=el('div','fields');
          L.signoff.fields.forEach(function(f){ var d=el('div','field');
            d.appendChild(el('div','field-label',f.label)); d.appendChild(el('div','field-line')); ff.appendChild(d); });
          sb.appendChild(ff);
        }
        so.appendChild(sb); body.appendChild(so);
      }
      box.appendChild(body);
      if(idx===0) box.classList.add('is-open');
      root.appendChild(box);
    });

    /* appendices */
    if(D.appendices&&D.appendices.length){
      root.appendChild(el('h2','part','Appendices'));
      D.appendices.forEach(function(A){
        var d=el('details','appx'), s=el('summary',null,A.title); d.appendChild(s);
        var bb=el('div','appx-body blocks'); blocks(A.blocks,bb); d.appendChild(bb); root.appendChild(d);
      });
    }

    var f=el('div','foot');
    f.appendChild(document.createTextNode('Every word on this page is David’s, taken from the original document. '));
    var a=el('a',null,'Download the original (.docx)'); a.href='../../../files/training/qualified-estimator-pass-off.docx';
    f.appendChild(a); root.appendChild(f);

    paintTotals();
  }

  /* tier rail + totals, recomputed without a full re-render */
  function paintTotals(){
    if(!D) return;
    var track=root.querySelector('.rail-track'); if(!track) return;
    track.innerHTML='';
    var standing='Not started', firstOpen=null;
    (D.levels||[]).forEach(function(L){
      var c=countOf(levelItems(L)), pct=c.total?Math.round(c.verified/c.total*100):0;
      var seg=el('div','rail-seg'+(c.total&&c.verified===c.total?' done':''));
      var bar=el('div','rail-bar'), i=el('i'); i.style.width=pct+'%'; bar.appendChild(i); seg.appendChild(bar);
      var short=(L.title||'').split('—')[0].trim().replace('Specialty Endorsement','Specialty');
      seg.appendChild(el('div','rail-name',short));
      if(c.total&&c.verified===c.total){ standing=L.title; }
      else if(!firstOpen){ firstOpen=L; seg.classList.add('cur'); }
      track.appendChild(seg);
    });
    var t=root.querySelector('.rail-tier'); if(t) t.textContent=standing;
    var foot=root.querySelector('.rail-foot');
    if(foot){
      if(firstOpen){ var c=countOf(levelItems(firstOpen));
        foot.textContent='Working on '+firstOpen.title+' — '+c.verified+' of '+c.total+' verified'+
          (c.claimed?', '+c.claimed+' waiting on review':'')+'.';
      } else foot.textContent='Every level complete.';
    }
    /* level headers */
    (D.levels||[]).forEach(function(L){
      var box=document.getElementById('lvl-'+L.id); if(!box) return;
      var c=countOf(levelItems(L));
      var b=box.querySelector('.level-count b'); if(b) b.textContent=c.verified+'/'+c.total;
      var lbl=box.querySelector('.level-count'); if(lbl){
        lbl.lastChild.nodeValue=c.claimed?c.claimed+' waiting':'verified'; }
      var fill=box.querySelector('.level-bar i');
      if(fill) fill.style.width=(c.total?Math.round(c.verified/c.total*100):0)+'%';
      box.classList.toggle('is-done',!!c.total&&c.verified===c.total);
      box.querySelectorAll('.sect').forEach(function(sect,si){
        var S=(L.sections||[])[si]; if(!S) return; var sc=countOf(S.items||[]);
        var el2=sect.querySelector('.sect-count'); if(el2){ el2.textContent=sc.verified+' of '+sc.total;
          el2.classList.toggle('all-done',!!sc.total&&sc.verified===sc.total); }
      });
    });
  }

  render();
})();
</script>
</body>
</html>
