<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style id="ttc-auth-prehide">html:not(.ttc-auth-ready) body > :not(#ttc-auth-gate){visibility:hidden!important}html:not(.ttc-auth-ready) body::before{content:"Opening TTC Crew sign-in… If this stays here, check your connection and reload.";display:block;padding:2rem;font:16px/1.5 system-ui}</style>
<noscript><style>body::before{content:"Turn on JavaScript to sign in to TTC Crew."!important}</style></noscript>
<script src="../../../shared/auth-gate.js"></script>
<meta name="theme-color" content="#2a3a25">
<title>Qualified Estimator Pass-Off — TTC Crew</title>
<!-- KIT: pre-paint. Must be inline and first. Do not move to shared/. -->
<script>(function(){try{var t=localStorage.getItem('ttc-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>html{background:#f9f6f2}@media(prefers-color-scheme:dark){html:not([data-theme="light"]){background:#1b2218}}html[data-theme="dark"]{background:#1b2218}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ttc-orange:#C9601A; --ttc-orange-dk:#a14d14; --ttc-green:#4a6741; --ttc-dark:#2a3a25; --ttc-gold:#f0c080;
    --bg:#f9f6f2; --bg-alt:#f1ece4; --card:#ffffff; --card-2:#fbf9f6;
    --fg1:#1f2419; --fg2:#5a5f55; --fg3:#8b8f86;
    --border:rgba(42,58,37,0.14); --border-soft:rgba(42,58,37,0.07);
    --rail:#e6e0d6;
    --open-bg:#f1ece4; --open-fg:#6b6f66;
    --claim-bg:#faeeda; --claim-fg:#633806; --claim-br:#EF9F27;
    --ver-bg:#eaf3de;  --ver-fg:#27500A;  --ver-br:#97C459;
    /* "Returned" reads as calm, not alarm — a document authorising real authority should never look
       like an error state. Muted neutral-amber, deliberately less saturated than "waiting on review". */
    --ret-bg:#f3ece1;  --ret-fg:#6b4a1f;  --ret-br:#c9a464;
    --shadow:0 1px 2px rgba(42,58,37,.06),0 8px 24px rgba(42,58,37,.06);
    --fs:16px; --touch:44px;
    --no-bg:#f8e4dd; --no-fg:#7d2d13; --no-br:#c8704f;
    --ring:#4a6741;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#1b2218; --bg-alt:#222b1e; --card:#26301f; --card-2:#2b3624;
    --fg1:#f1eee7; --fg2:#b9bcb2; --fg3:#858a7e;
    --border:rgba(249,246,242,.16); --border-soft:rgba(249,246,242,.08); --rail:#36432d;
    --open-bg:#2b3624; --open-fg:#9aa091;
    --claim-bg:#3d2d12; --claim-fg:#f3cd8e; --claim-br:#a9762a;
    --ver-bg:#22381a;  --ver-fg:#c6e3a3;  --ver-br:#4f7a37;
    --ret-bg:#3a3020;  --ret-fg:#d8c398;  --ret-br:#8a7550;
    --ttc-orange:#e0782f; --ttc-gold:#d9ad6f;
    --no-bg:#3d2018; --no-fg:#f0b9a3; --no-br:#a3563a;
    --ring:#8fbf5a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }}
  :root[data-theme="dark"]{
    --bg:#1b2218; --bg-alt:#222b1e; --card:#26301f; --card-2:#2b3624;
    --fg1:#f1eee7; --fg2:#b9bcb2; --fg3:#858a7e;
    --border:rgba(249,246,242,.16); --border-soft:rgba(249,246,242,.08); --rail:#36432d;
    --open-bg:#2b3624; --open-fg:#9aa091;
    --claim-bg:#3d2d12; --claim-fg:#f3cd8e; --claim-br:#a9762a;
    --ver-bg:#22381a;  --ver-fg:#c6e3a3;  --ver-br:#4f7a37;
    --ret-bg:#3a3020;  --ret-fg:#d8c398;  --ret-br:#8a7550;
    --ttc-orange:#e0782f; --ttc-gold:#d9ad6f;
    --no-bg:#3d2018; --no-fg:#f0b9a3; --no-br:#a3563a;
    --ring:#8fbf5a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
  :root[data-textsize="big"]{--fs:18.5px}
  /* David's front door: his crew, not the document */
  .crew-head{margin:4px 0 14px}
  .crew-sum{font-size:14px;color:var(--fg2);margin:0 0 14px}
  .crew-sum b{color:var(--claim-fg)}
  .crew-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin:0 0 8px;
        min-height:64px;border:1px solid var(--border);border-radius:14px;background:var(--card);cursor:pointer}
  .crew-row.has-waiting{border-color:var(--claim-br);background:var(--claim-bg)}
  .crew-av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
        background:var(--bg-alt);color:var(--fg2);font-weight:800;font-size:13px;border:1px solid var(--border)}
  .crew-av img{width:100%;height:100%;object-fit:cover}
  .crew-mid{flex:1;min-width:0}
  .crew-name{font-weight:700;font-size:15px}
  .crew-row.has-waiting .crew-name{color:var(--claim-fg)}
  .crew-tier{font-size:12.5px;color:var(--fg3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crew-bar{height:5px;border-radius:99px;background:var(--rail);overflow:hidden;margin-top:7px}
  .crew-bar i{display:block;height:100%;background:var(--ttc-green);border-radius:99px}
  .crew-right{flex:0 0 auto;text-align:right}
  .crew-wait{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
        padding:4px 9px;border-radius:99px;background:var(--claim-br);color:#3a2a10;white-space:nowrap}
  .crew-count{font-size:12.5px;color:var(--fg3);font-variant-numeric:tabular-nums;margin-top:4px}
  .crew-quiet{font-size:12.5px;color:var(--fg3)}
  .crew-links{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 0;font-size:13.5px}
  .crew-links a{color:var(--ttc-orange);font-weight:700}
  .working-on{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px;padding:11px 14px;
        border-radius:12px;background:var(--claim-bg);color:var(--claim-fg);border:1px solid var(--claim-br);font-size:13.5px}
  .working-on b{font-weight:800}
  .working-on-back{margin-left:auto;font-weight:700;text-decoration:underline}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{font-size:var(--fs)}
  body{background:var(--bg);color:var(--fg1);font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
       font-size:var(--fs);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  a{text-decoration:none;color:inherit} svg{display:block}
  button{font:inherit;color:inherit}
  input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ttc-orange);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:calc(var(--touch) + 20px);
          padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
          background:var(--ttc-dark);color:#f1eee7}
  .topbar-back{display:flex;align-items:center;justify-content:center;width:var(--touch);height:var(--touch);flex:0 0 auto}
  .topbar-back svg{width:22px;height:22px}
  .topbar-title{flex:1;font-size:15px;font-weight:600;text-align:center;margin-right:var(--touch)}
  .icon-btn{background:none;border:0;min-width:var(--touch);min-height:var(--touch);padding:6px 8px;cursor:pointer;font-weight:700;font-size:14px;opacity:.9}

  .wrap{max-width:780px;margin:0 auto;padding:18px 16px calc(48px + env(safe-area-inset-bottom))}
  .tabular{font-variant-numeric:tabular-nums}

  /* ---- sign-in (same idiom as the other TTC Crew pages) ---- */
  .signin-wrap{max-width:420px;margin:40px auto;padding:0 16px}
  .signin-note{font-size:13px;color:var(--fg2);margin:0 0 14px}
  .signin-list{display:flex;flex-direction:column;gap:8px}
  .signin-person{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
        border:1px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
  .signin-person:active{background:var(--bg-alt)}
  .signin-person-name{font-weight:700;font-size:14.5px}
  .signin-person-role{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3)}
  .test-tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--claim-bg);color:var(--claim-fg);
        border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
  .field-row{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
  .field-row label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3)}
  .field-row input,.field-row textarea{padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg-alt);font-size:15px}
  .signin-status{font-size:13px;color:var(--fg2);min-height:18px;margin:8px 0 0}
  .signin-status.err{color:var(--ret-fg)}
  .btn{min-height:var(--touch);font-size:13px;font-weight:700;padding:8px 13px;border-radius:9px;border:1px solid var(--border);
       background:var(--card);cursor:pointer}
  .btn.primary{background:var(--ttc-orange);border-color:var(--ttc-orange);color:#fff}
  .btn.good{background:var(--ver-br);border-color:var(--ver-br);color:#12280a}
  .btn.bad{background:var(--card);border-color:var(--ret-br);color:var(--ret-fg)}
  .btn.small{padding:7px 12px;font-size:12.5px}
  .btn.full{width:100%;display:block;text-align:center;margin-top:6px}
  .btn:disabled{opacity:.5;cursor:default}

  .doc-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ttc-green);margin:0 0 8px}
  h1{font-size:clamp(25px,5.4vw,33px);line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}

  /* ---- generic blocks (verbatim content) ---- */
  .blocks p{margin:0 0 10px}
  .blocks h4{font-size:14.5px;font-weight:700;margin:16px 0 6px}
  .blocks ul,.blocks ol{margin:0 0 10px;padding-left:22px}
  .blocks li{margin-bottom:5px}
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card);margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--border-soft);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);font-weight:700;background:var(--bg-alt)}
  tr:last-child td{border-bottom:0}
  .note-block{border-left:3px solid var(--ttc-gold);padding:2px 0 2px 13px;margin:0 0 12px;color:var(--fg2)}

  /* ---- summary: flat, the first thing on the page ---- */
  .summary{margin:6px 0 20px}
  .summary-line{font-size:14px;color:var(--fg2);margin:0 0 3px}
  .summary-stage{margin:14px 0 2px}
  .summary-stage-name{font-size:15.5px;font-weight:700;color:var(--fg1);margin:0 0 8px}
  .summary-stage-count{font-size:13px;color:var(--fg2);margin-top:7px}
  .summary-notes{font-size:13px;color:var(--claim-fg);margin:7px 0 14px}
  .summary .save-state{margin-top:12px}

  /* ---- how this works + the 4-mark legend ---- */
  details.howto{margin:0 0 16px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
  details.howto>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
                        min-height:var(--touch);padding:10px 14px;font-weight:800;font-size:14px}
  details.howto>summary::-webkit-details-marker{display:none}
  details.howto>summary::after{content:'›';color:var(--fg3);transition:transform .2s ease}
  details.howto[open]>summary::after{transform:rotate(90deg)}
  details.howto>.blocks{padding:0 14px 14px}
  details.more{margin:0 0 10px}
  details.more>summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ttc-gold);
                       min-height:32px;display:flex;align-items:center;gap:6px}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::after{content:'›';transition:transform .2s ease}
  details.more[open]>summary::after{transform:rotate(90deg)}

  .legend{display:flex;flex-direction:column;gap:11px;margin:14px 0 12px;padding-top:12px;border-top:1px solid var(--border-soft)}
  .legend-row{display:flex;align-items:flex-start;gap:10px}
  .legend-text b{display:block;font-size:13.5px;font-weight:700;color:var(--fg1)}
  .legend-text span{font-size:12.5px;color:var(--fg3)}

  /* ---- the 4-state mark, shared by the legend and every standard row ---- */
  .mark{flex:0 0 auto;border-radius:50%;border:2px solid var(--border);background:var(--card);display:grid;place-items:center}
  .mark svg{display:block}
  .mark[data-state="claimed"]{border-color:var(--claim-br);background:var(--claim-bg);color:var(--claim-fg)}
  .mark[data-state="verified"]{border-color:var(--ver-br);background:var(--ver-br);color:#12280a}
  .mark[data-state="returned"]{border-color:var(--ret-br);background:var(--ret-bg);color:var(--ret-fg)}
  .mark.sm{width:26px;height:26px} .mark.sm svg{width:13px;height:13px}
  .mark.lg{width:30px;height:30px} .mark.lg svg{width:15px;height:15px}

  /* ---- stages: a stepper, not a document ---- */
  .stagebar-wrap{margin:18px 0 24px}
  .stages-row{display:flex;gap:6px;margin:0 0 10px}
  .stagebtn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
        min-height:58px;padding:9px 4px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);
        color:var(--fg2);cursor:pointer;text-align:center}
  .stagebtn svg{width:16px;height:16px}
  .stagebtn-lbl{font-size:12.5px;font-weight:700;color:var(--fg1);line-height:1.25}
  .stagebtn-cap{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--fg3)}
  .stagebtn.is-done{border-color:var(--ver-br);background:var(--ver-bg)}
  .stagebtn.is-done svg{color:var(--ver-fg)}
  .stagebtn.is-done .stagebtn-cap{color:var(--ver-fg)}
  .stagebtn.is-current{background:var(--ttc-dark);border-color:var(--ttc-dark)}
  .stagebtn.is-current .stagebtn-lbl{color:#f1eee7}
  .stagebtn.is-current .stagebtn-cap{color:var(--ttc-gold)}
  .stagebtn.is-locked{background:var(--bg-alt)}
  .stagebtn.is-locked .stagebtn-lbl{color:var(--fg3)}
  .stagebtn[aria-selected="true"]{border-width:2px;border-color:var(--ttc-orange)}
  .stages-sub{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:2px 0 8px}

  /* ---- stage panel: one stage, no card around the whole thing ---- */
  .panel{margin:4px 0 24px}
  .panel-title{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:2px 0 12px;line-height:1.2}
  .panel-locked{font-size:13px;color:var(--claim-fg);background:var(--claim-bg);border:1px solid var(--claim-br);
        border-radius:10px;padding:10px 12px;margin:0 0 14px}
  .panel-clears{font-size:14.5px;line-height:1.55;color:var(--fg1);margin:2px 0 8px}
  .panel-clears b{font-weight:800}
  .panel-before{font-size:13px;line-height:1.5;color:var(--fg3);margin:0 0 14px}
  .panel-before b{font-weight:700;color:var(--fg2)}

  /* ---- groups: flat full-width rows separated by hairlines, no card wrapping them ---- */
  .grp-list{margin:8px 0 6px;border-top:1px solid var(--border)}
  .grp{border-bottom:1px solid var(--border)}
  .grp-head{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 2px;
        background:none;border:0;text-align:left;cursor:pointer}
  .grp-letter{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--bg-alt);color:var(--fg2);
        display:grid;place-items:center;font-weight:800;font-size:12.5px}
  .grp-letter.done{background:var(--ver-br);color:#12280a}
  .grp-titles{flex:1;min-width:0}
  .grp-title{font-size:15px;font-weight:700;color:var(--fg1);line-height:1.3}
  .grp-short{font-size:12.5px;color:var(--fg3);margin-top:2px;line-height:1.35}
  .grp-count{flex:0 0 auto;font-size:12.5px;color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .grp-count.done{color:var(--ver-fg);font-weight:700}
  .grp-chev{flex:0 0 auto;color:var(--fg3);transition:transform .18s ease}
  .grp[data-open="1"] .grp-chev{transform:rotate(90deg)}
  .grp-body{padding:0 0 16px}
  .grp[data-open="0"] .grp-body{display:none}
  .grp-note{font-size:14px;line-height:1.55;color:var(--fg2);margin:0 0 10px}
  .grp-note b{color:var(--fg1);font-weight:700}

  /* ---- standard row: full-width text, a status circle, never a card ---- */
  .std{display:flex;gap:11px;align-items:flex-start;width:100%;padding:12px 2px;
        border-top:1px solid var(--border-soft);cursor:pointer}
  .std:first-child{border-top:0}
  .std-body{flex:1;min-width:0;padding-top:2px}
  .item-text{font-size:1rem;line-height:1.55;color:var(--fg1)}
  .more-link{background:none;border:0;min-height:var(--touch);color:var(--ttc-orange);font-weight:700;font-size:13px;cursor:pointer;padding:7px 0}
  .std-sub{font-size:12.5px;margin-top:6px;color:var(--fg3)}
  .std[data-state="claimed"] .std-sub{color:var(--claim-fg)}
  .std[data-state="returned"] .std-sub{color:var(--ret-fg)}
  .std-pass-inline{display:inline-flex;align-items:center;min-height:38px;margin-top:2px;background:none;border:0;
        color:var(--ver-fg);font-weight:700;font-size:13px;padding:4px 2px;cursor:pointer}
  .item-note{font-size:13px;color:var(--fg2);margin-top:10px;padding:9px 11px;background:var(--card-2);
             border-radius:9px;border:1px solid var(--border-soft);white-space:pre-line}
  .item-note b{font-weight:700;color:var(--fg1)}

  /* ---- sign-off (always visible — the gate, never collapsed) ---- */
  .signoff{margin:14px 0 4px;border:2px solid var(--ttc-gold);border-radius:14px;background:var(--card);overflow:hidden}
  .signoff-head{padding:10px 14px;background:var(--ttc-gold);color:#3a2a10;font-size:13px;font-weight:800;
                letter-spacing:.06em;text-transform:uppercase}
  .signoff-body{padding:13px 14px 6px}
  .signoff-options{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:10px}
  .field{border:1px dashed var(--border);border-radius:9px;padding:8px 10px}
  .field-label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:700}
  .field-value{font-size:14.5px;font-weight:700;margin-top:3px;line-height:1.35;word-break:break-word}
  .field-value.empty{font-weight:600;color:var(--fg3)}
  .field.filled{border-style:solid}

  /* ---- tools (the appendices) ---- */
  details.appx{border:1px solid var(--border);border-radius:14px;background:var(--card);margin:0 0 10px;
               box-shadow:var(--shadow);overflow:hidden}
  details.appx>summary{padding:13px 16px;cursor:pointer;font-weight:800;font-size:15px;list-style:none;
        display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:var(--touch)}
  details.appx>summary::-webkit-details-marker{display:none}
  details.appx>summary::after{content:'›';color:var(--fg3);transition:transform .2s;flex:0 0 auto}
  details.appx[open]>summary::after{transform:rotate(90deg)}
  .appx-sub{font-size:12px;font-weight:600;color:var(--fg3);margin-top:2px}
  .appx-not{font-size:12.5px;color:var(--fg3);font-style:italic;margin:0 0 12px}
  .appx-body{padding:0 16px 14px}

  #stages,.panel,.signoff{scroll-margin-top:calc(var(--touch) + 34px + env(safe-area-inset-top))}

  /* ---- interactive appendix forms (Appendix A scoring, B audit, C authority) ---- */
  .fm-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:12px 0 4px}
  .fm-f{display:flex;flex-direction:column;gap:4px}
  .fm-f label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:700}
  .fm-f input,.fm-f select{font:inherit;font-size:14.5px;padding:8px 9px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);color:var(--fg1);min-width:0;width:100%}
  .fm-f input:disabled,.fm-f select:disabled{opacity:.72}
  .fm-hint{font-size:11.5px;color:var(--fg3);margin:2px 0 0}

  .fm-rows{margin:14px 0 0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .fm-row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-top:1px solid var(--border-soft)}
  .fm-row:first-child{border-top:0}
  .fm-row.answered{background:var(--card-2)}
  .fm-row-text{flex:1;font-size:14.5px;line-height:1.45}
  .fm-seg{display:flex;gap:5px;flex:0 0 auto;padding-top:1px}
  .fm-seg button{font:inherit;font-size:12.5px;font-weight:700;padding:7px 10px;min-width:44px;cursor:pointer;
    border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg3)}
  .fm-seg button[aria-pressed="true"]{border-width:1.5px}
  .fm-seg button.yes[aria-pressed="true"]{background:var(--ver-bg);color:var(--ver-fg);border-color:var(--ver-br)}
  .fm-seg button.no[aria-pressed="true"]{background:var(--no-bg);color:var(--no-fg);border-color:var(--no-br)}
  .fm-seg button.na[aria-pressed="true"]{background:var(--open-bg);color:var(--open-fg);border-color:var(--border)}
  @media(max-width:430px){.fm-row{flex-wrap:wrap}.fm-row-text{flex:1 0 100%}.fm-seg{padding-top:0}}

  .fm-score{margin-top:14px;padding:12px 13px;border:2px solid var(--ttc-gold);border-radius:12px;
    background:var(--card);font-size:15px;font-weight:800;line-height:1.75}
  .fm-score .n{display:inline-block;min-width:34px;padding:0 6px;text-align:center;border-bottom:2px solid var(--ttc-gold)}
  .fm-score .pending{color:var(--fg3);font-weight:600}
  .fm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* Appendix B — one row per measure, its two fields stacked under the label. Never a wide table:
     that is the one thing on this page that used to force sideways scrolling on a phone. */
  .fm-row-b{padding:12px 2px;border-top:1px solid var(--border-soft)}
  .fm-row-b:first-child{border-top:0}
  .fm-row-b .fm-row-text{font-weight:700;margin-bottom:8px;font-size:14.5px}
  .fm-row-b .fm-head{margin:0 0 6px}
  .fm-var{margin-top:2px;font-size:13.5px;font-weight:700}
  .fm-var .up{color:var(--no-fg)} .fm-var .down{color:var(--ver-fg)} .fm-var .flat{color:var(--fg3)}

  .fm-tally{margin-top:14px;padding:12px 13px;border:1px dashed var(--border);border-radius:12px;background:var(--card-2)}
  .fm-tally-h{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:800}
  .fm-tally-note{font-size:11.5px;color:var(--fg3);margin:3px 0 9px;line-height:1.5}
  .fm-tally-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
  .fm-tally-out{margin-top:9px;font-size:14px;font-weight:700}
  .fm-tally-out .dim{font-weight:600;color:var(--fg3)}
  .fm-run{margin-top:12px;padding:12px 13px;border:1px solid var(--border);border-radius:12px;background:var(--card-2)}
  .fm-run-h{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:800;margin-bottom:6px}
  .fm-run-line{font-size:14px;line-height:1.7}
  .fm-run-line b{font-size:15.5px}
  .fm-saved{margin-top:16px;padding-top:12px;border-top:1px solid var(--border-soft)}
  .fm-saved-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);font-weight:800;margin-bottom:7px}
  .fm-card{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);
    border-radius:11px;background:var(--card);margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
  .fm-card .pct{font-size:17px;font-weight:800;flex:0 0 auto;min-width:52px}
  .fm-card .meta{flex:1;min-width:0}
  .fm-card .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fm-card .meta span{font-size:12px;color:var(--fg3)}
  .fm-card .pill{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:4px 8px;border-radius:999px;border:1px solid var(--border);color:var(--fg3)}
  .fm-card .pill.ok{background:var(--ver-bg);border-color:var(--ver-br);color:var(--ver-fg)}
  .fm-card .pill.wait{background:var(--claim-bg);border-color:var(--claim-br);color:var(--claim-fg)}

  .fm-auth{margin-top:4px}
  .fm-auth .box{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:transparent}
  .fm-auth .box.on{background:var(--ver-bg);border-color:var(--ver-br);color:var(--ver-fg)}
  .fm-auth .box svg{width:16px;height:16px}
  .fm-auth .sub{font-size:12.5px;color:var(--fg3);margin-top:3px}

  h2.part{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:800;
          margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--border-soft)}

  .foot{margin-top:30px;padding-top:15px;border-top:1px solid var(--border);font-size:12.5px;color:var(--fg3);text-align:center}
  .foot a{color:var(--ttc-orange);font-weight:600}
  .loading{padding:50px 10px;text-align:center;color:var(--fg3)}

  /* ---- stages key + strip, used only by the supervisor's crew list ---- */
  .stages{display:flex;gap:3px;margin-top:7px}
  .stage{flex:1 1 0;height:7px;border-radius:99px;background:var(--rail);overflow:hidden}
  .stage.end{flex:.7 1 0;margin-left:3px}
  .stage i{display:block;height:100%;background:var(--ring);border-radius:99px}
  .stage.done i{background:var(--ttc-gold)}
  .stage.waiting{box-shadow:0 0 0 1.5px var(--claim-br)}
  .stages-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--fg3);margin:-4px 0 12px}
  .stages-key span{display:inline-flex;align-items:center;gap:5px}
  .stages-key i{width:14px;height:6px;border-radius:99px;background:var(--rail)}
  .stages-key i.p{background:var(--ring)} .stages-key i.d{background:var(--ttc-gold)} .stages-key i.w{box-shadow:0 0 0 1.5px var(--claim-br)}

  /* ---- evidence / reason sheet ---- */
  .sheet-overlay{position:fixed;inset:0;background:rgba(20,20,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet-overlay[hidden]{display:none}
  .sheet{background:var(--card);border-radius:18px 18px 0 0;max-width:480px;width:100%;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
        box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:86vh;overflow-y:auto}
  @media(min-width:560px){.sheet-overlay{align-items:center}.sheet{border-radius:18px;max-height:80vh}}
  .sheet-title{font-size:16px;font-weight:800;margin-bottom:2px}
  .sheet-item-text{font-size:13.5px;color:var(--fg2);margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--border-soft)}
  .sheet-close{float:right;min-width:var(--touch);min-height:var(--touch);background:none;border:0;font-size:20px;color:var(--fg3);cursor:pointer}
  .sheet .field-row textarea{min-height:70px;resize:vertical}
  .sheet-photo-preview{width:72px;height:72px;border-radius:10px;object-fit:cover;margin-top:6px;display:block}
  .sheet-photo-note{font-size:11.5px;color:var(--fg3);margin-top:5px}
  .sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}

  /* ---- save-state indicator (now lives inline in the summary, not a sticky bar) ---- */
  .save-state{display:inline-flex;align-items:center;gap:5px;margin-top:2px;font-size:11.5px;color:var(--fg3)}
  .save-state::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ver-br)}
  .save-state[data-state="saving"]::before{background:var(--ttc-gold);animation:pulse 1s infinite}
  .save-state[data-state="offline"]::before,.save-state[data-state="error"]::before{background:var(--no-br)}
  @keyframes pulse{50%{opacity:.35}}

  /* ---- toast (undo, never a confirm dialog) ---- */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
        background:var(--ttc-dark);color:#f1eee7;padding:10px 14px;border-radius:11px;font-size:13.5px;
        display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:60;max-width:calc(100vw - 32px)}
  .toast[hidden]{display:none}
  .toast button{min-height:var(--touch);background:none;border:0;color:var(--ttc-gold);font-weight:700;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="../../../index.html#/reviews" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="topbar-title">Qualified Estimator Pass-Off</div>
  <button class="icon-btn" id="bigText" title="Bigger text">Aa</button>
</div>

<div class="wrap" id="root"><div class="loading">Loading the pass-off…</div></div>

<div class="sheet-overlay" id="sheetOverlay" hidden><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="../../../data/people.js"></script>
<script src="../../../data/passoff.js"></script>
<script src="../../../data/passoff-guide.js"></script>
<script src="../../../services/records.js"></script>
<script>
(function(){
  'use strict';
  var D = window.TTC_PASSOFF || null;
  var GUIDE = window.TTC_PASSOFF_GUIDE || {};
  var root = document.getElementById('root');
  var overlay = document.getElementById('sheetOverlay');
  var sheetBody = document.getElementById('sheetBody');
  var toastEl = document.getElementById('toast');

  /* ---------- text size ---------- */
  var TS='ttc-textsize';
  try{ if(localStorage.getItem(TS)==='big') document.documentElement.setAttribute('data-textsize','big'); }catch(e){}
  document.getElementById('bigText').addEventListener('click',function(){
    var on=document.documentElement.getAttribute('data-textsize')==='big';
    if(on) document.documentElement.removeAttribute('data-textsize');
    else document.documentElement.setAttribute('data-textsize','big');
    try{ localStorage.setItem(TS,on?'normal':'big'); }catch(e){}
  });

  /* ---------- helpers ---------- */
  var SVGNS='http://www.w3.org/2000/svg';
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls;
    if(txt!=null)e.textContent=txt; return e; }
  function elWithLabel(cls,label,text){
    var p=el('p',cls); p.appendChild(el('b',null,label+' ')); p.appendChild(document.createTextNode(text)); return p;
  }
  function tick(){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor');
    s.setAttribute('stroke-width','3.2'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    var p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d','M20 6L9 17l-5-5'); s.appendChild(p); return s; }
  function chev(){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor');
    s.setAttribute('stroke-width','2.2'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    s.setAttribute('width','18'); s.setAttribute('height','18');
    var p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d','M9 18l6-6-6-6'); s.appendChild(p); return s; }
  function clockIcon(){ var s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
    s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2.3'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    var c=document.createElementNS(SVGNS,'circle'); c.setAttribute('cx','12'); c.setAttribute('cy','12'); c.setAttribute('r','9'); s.appendChild(c);
    var p=document.createElementNS(SVGNS,'path'); p.setAttribute('d','M12 7v5l4 2'); s.appendChild(p); return s; }
  function returnIcon(){ var s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
    s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2.3'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    var p1=document.createElementNS(SVGNS,'path'); p1.setAttribute('d','M9 14L4 9l5-5'); s.appendChild(p1);
    var p2=document.createElementNS(SVGNS,'path'); p2.setAttribute('d','M4 9h10a5 5 0 0 1 5 5v3'); s.appendChild(p2); return s; }
  function lockIcon(){ var s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
    s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2.4'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    var a=document.createElementNS(SVGNS,'rect'); a.setAttribute('x','5'); a.setAttribute('y','11'); a.setAttribute('width','14'); a.setAttribute('height','10'); a.setAttribute('rx','2');
    var b=document.createElementNS(SVGNS,'path'); b.setAttribute('d','M8 11V7a4 4 0 0 1 8 0v4'); s.appendChild(a); s.appendChild(b); return s; }
  // The one status circle used everywhere a standard's state is shown: the legend and every row.
  function markIcon(state){
    if(state==='verified') return tick();
    if(state==='claimed') return clockIcon();
    if(state==='returned') return returnIcon();
    return null;
  }
  function markEl(state,size){
    var m=el('span','mark '+(size||'lg')); m.setAttribute('data-state',state); m.setAttribute('aria-hidden','true');
    var icon=markIcon(state); if(icon) m.appendChild(icon);
    return m;
  }
  function when(iso){ if(!iso) return ''; var d=new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function relTime(ts){ if(!ts) return ''; var days=Math.floor((Date.now()-ts)/86400000);
    if(days<=0) return 'today'; if(days===1) return '1 day ago'; if(days<30) return days+' days ago';
    return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function exactTime(ts){ return ts?new Date(ts).toLocaleString():''; }
  function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }

  var toastTimer=null;
  var saveState='local';
  function saveStateText(){
    return saveState==='saving' ? 'Saving…' : saveState==='synced' ? 'Live · Synced' :
      saveState==='offline' ? 'Offline · Retrying' : saveState==='error' ? 'Not synced' : 'Saved on this device';
  }
  function setSaveState(next){
    saveState=next;
    var status=document.getElementById('save-state');
    if(status){ status.setAttribute('data-state',saveState); status.textContent=saveStateText(); }
  }
  function showToast(msg, onUndo){
    toastEl.innerHTML='';
    toastEl.appendChild(el('span',null,msg));
    if(onUndo){ var b=el('button',null,'Undo'); b.onclick=function(){ toastEl.hidden=true; onUndo(); }; toastEl.appendChild(b); }
    toastEl.hidden=false;
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastEl.hidden=true; }, 6000);
  }

  function closeSheet(){ overlay.hidden=true; sheetBody.innerHTML=''; }
  overlay.addEventListener('click',function(e){ if(e.target===overlay) closeSheet(); });

  /* ---------- sign-in screen (same idiom as the rest of the app) ---------- */
  function renderSignIn(){
    root.innerHTML='';
    var wrap=el('div','signin-wrap');
    wrap.appendChild(el('h1',null,'Sign in'));
    var local = !TTCRecords.configured();
    if(local){
      wrap.appendChild(el('p','signin-note','No records backend deployed yet — this device is using its own local copy. Pick yourself from the roster below.'));
      var list=el('div','signin-list');
      TTCRecords.people().forEach(function(p){
        var b=el('button','signin-person');
        var left=el('span','signin-person-name'); left.textContent=p.display_name;
        if(p.test){ var tag=el('span','test-tag','TEST'); left.appendChild(tag); }
        var right=el('span','signin-person-role',p.role);
        b.appendChild(left); b.appendChild(right);
        b.onclick=function(){ TTCRecords.signInAs(p.person_id).then(boot).catch(function(err){ alert(err.message||'Could not sign in.'); }); };
        list.appendChild(b);
      });
      wrap.appendChild(list);
    } else {
      wrap.appendChild(el('p','signin-note','Sign in with your email — a 6-digit code will be sent to it.'));
      var fr1=el('div','field-row'); fr1.appendChild(el('label',null,'Email'));
      var emailInput=document.createElement('input'); emailInput.type='email';
      fr1.appendChild(emailInput); wrap.appendChild(fr1);
      var sendBtn=el('button','btn primary','Send code'); wrap.appendChild(sendBtn);
      var codeWrap=el('div',null); codeWrap.hidden=true;
      var fr2=el('div','field-row'); fr2.appendChild(el('label',null,'6-digit code'));
      var codeInput=document.createElement('input'); codeInput.type='text'; codeInput.inputMode='numeric'; codeInput.maxLength=6;
      fr2.appendChild(codeInput); codeWrap.appendChild(fr2);
      var verifyBtn=el('button','btn primary','Verify'); codeWrap.appendChild(verifyBtn);
      wrap.appendChild(codeWrap);
      var status=el('p','signin-status'); wrap.appendChild(status);
      sendBtn.onclick=function(){
        status.className='signin-status'; status.textContent='Sending…';
        TTCRecords.signIn(emailInput.value).then(function(){ status.textContent='Code sent — check that inbox.'; codeWrap.hidden=false; })
          .catch(function(err){ status.className='signin-status err'; status.textContent=err.message||'Could not send a code.'; });
      };
      verifyBtn.onclick=function(){
        status.className='signin-status'; status.textContent='Verifying…';
        TTCRecords.verifyCode(codeInput.value).then(boot).catch(function(err){ status.className='signin-status err'; status.textContent=err.message||'Wrong code.'; });
      };
    }
    root.appendChild(wrap);
  }

  /* ---------- legacy local-storage migration (offer, never delete the source) ---------- */
  function buildLegacyIdMap(){
    var map={};
    if(!D) return map;
    (D.levels||[]).forEach(function(L){
      (L.sections||[]).forEach(function(S){ (S.items||[]).forEach(function(it){ if(it.legacy_id) map[it.legacy_id]=it.id; }); });
      if(L.signoff&&L.signoff.items) L.signoff.items.forEach(function(it){ if(it.legacy_id) map[it.legacy_id]=it.id; });
    });
    return map;
  }
  function findLegacyEntry(store, name){
    if(!store||!store.people) return null;
    var target=(name||'').trim().toLowerCase();
    var keys=Object.keys(store.people);
    for(var i=0;i<keys.length;i++){ if(keys[i].trim().toLowerCase()===target) return store.people[keys[i]]; }
    return null;
  }
  function maybeMigrateLegacy(self){
    var flagKey='ttc-passoff-migrated:'+self.id;
    var flags={}; try{ flags=JSON.parse(localStorage.getItem(flagKey)||'null')||{}; }catch(e){}
    var jobs=[];
    if(!flags.v2){
      var v2=null; try{ v2=JSON.parse(localStorage.getItem('ttc-passoff:v2')||'null'); }catch(e){}
      var e2=findLegacyEntry(v2, self.name);
      if(e2 && e2.items && Object.keys(e2.items).length){
        jobs.push(offerImport('We found progress saved on this phone for '+self.name+'. Import it?', e2.items, function(id){return id;}));
      }
    }
    if(!flags.v1){
      var v1=null; try{ v1=JSON.parse(localStorage.getItem('ttc-passoff:v1')||'null'); }catch(e){}
      var e1=findLegacyEntry(v1, self.name);
      if(e1 && e1.items && Object.keys(e1.items).length){
        var legacyMap=buildLegacyIdMap();
        jobs.push(offerImport('We also found an older save on this phone for '+self.name+'. Import that too?', e1.items, function(hex){ return legacyMap[hex]||null; }));
      }
    }
    flags.v1=true; flags.v2=true;
    try{ localStorage.setItem(flagKey, JSON.stringify(flags)); }catch(e){}
    return Promise.all(jobs);
  }
  function offerImport(question, rawItems, mapKey){
    var items=[];
    Object.keys(rawItems).forEach(function(k){
      var itemId=mapKey(k); var row=rawItems[k];
      if(itemId && row && row.state) items.push({ person_id:TTCRecords.person().id, area:'passoff', item_id:itemId,
        item_label:'', state: row.state==='claimed'||row.state==='verified'||row.state==='returned'?row.state:'claimed',
        note: row.note||row.claimNote||'', ts: row.ts?new Date(row.ts).getTime():Date.now() });
    });
    if(!items.length) return Promise.resolve();
    if(!window.confirm(question)) return Promise.resolve();
    return TTCRecords.recordBatch(items).catch(function(){ /* import best-effort; original keys stay untouched either way */ });
  }

  /* ---------- item text (David's sentence stays the hero; only very long ones clamp) ---------- */
  function itemTextEl(text){
    var wrap=el('div','item-text');
    if(text && text.length>260){
      var cut=text.slice(0,240).replace(/\s+\S*$/,'');
      var span=el('span',null,cut+'…');
      wrap.appendChild(span);
      wrap.appendChild(document.createTextNode(' '));
      var more=el('button','more-link','More'); more.type='button';
      var expanded=false;
      more.onclick=function(ev){ ev.stopPropagation(); expanded=!expanded; span.textContent=expanded?text:(cut+'…'); more.textContent=expanded?'Less':'More'; };
      wrap.appendChild(more);
    } else {
      wrap.textContent=text||'';
    }
    return wrap;
  }

  /* Render a verbatim block exactly as extracted. Never rewrite the text. */
  function blocks(list,host){
    (list||[]).forEach(function(b){
      if(!b) return;
      if(b.type==='p'||b.type==='note'){
        var p=el('p',b.type==='note'?'note-block':null);
        if(b.html) p.innerHTML=b.html; else p.textContent=b.text||'';
        host.appendChild(p);
      } else if(b.type==='h4'){ host.appendChild(el('h4',null,b.text||''));
      } else if(b.type==='ul'||b.type==='ol'){
        var l=el(b.type==='ul'?'ul':'ol');
        (b.items||[]).forEach(function(t){ l.appendChild(el('li',null,t)); }); host.appendChild(l);
      } else if(b.type==='table'){ host.appendChild(tableOf(b)); }
    });
  }
  function tableOf(b){
    var w=el('div','tablewrap'), t=el('table'), rows=b.rows||[];
    if(b.header&&rows.length){ var th=el('thead'),tr=el('tr');
      rows[0].forEach(function(c){ tr.appendChild(el('th',null,c)); }); th.appendChild(tr); t.appendChild(th); rows=rows.slice(1); }
    var tb=el('tbody');
    rows.forEach(function(r){ var tr=el('tr'); r.forEach(function(c){ tr.appendChild(el('td',null,c)); }); tb.appendChild(tr); });
    t.appendChild(tb); w.appendChild(t); return w;
  }

  /* ================================================================================
     INTERACTIVE APPENDICES — Appendix A (client-visit scoring), B (estimate audit),
     C (authority record). Every word of every behaviour, measure and tier below comes
     straight out of passoff.js, which came straight out of David's .docx. Nothing here
     rewrites, shortens or re-orders his wording; the only thing added is the ability to
     tap it, score it, and keep it.

     A and B are REPEATABLE — one saved sheet per visit or per job — and every save is
     kept under the person being scored, so their whole history is on their own page.
     Storage: records area 'passoff-forms', one record per saved sheet, the filled-in
     values carried as JSON in the record's note field. No schema change on the backend.
     ================================================================================ */
  var FORMS_AREA='passoff-forms';
  var formsRecords={};          // item_id -> record, for the person whose page is open
  var formDrafts={};            // appendix id -> in-progress values, so a half-filled sheet survives a re-render
  var formOpenSaved={};         // appendix id -> item_id of a saved sheet being viewed, or null for a new one

  function todayISOForm(){ return todayISO(); }
  function canVerifyForms(){ return TTCRecords.can('verify_others'); }
  function subjectId(){ return subject ? subject.id : (TTCRecords.person()||{}).id; }

  // A saved sheet is stored by whoever it is ABOUT. Crew may only write their own and only as
  // 'claimed' (the server enforces this too) — a scoring sheet a trainer fills in lands 'verified'.
  function formStateForWriter(){ return canVerifyForms() ? 'verified' : 'claimed'; }

  function parseFormNote(rec){
    if(!rec||!rec.note) return null;
    try{ var o=JSON.parse(rec.note); return (o&&o.v)?o:null; }catch(e){ return null; }
  }
  function savedFormsOf(appendixId){
    var out=[];
    Object.keys(formsRecords).forEach(function(id){
      if(id.indexOf(appendixId+':')!==0) return;
      var data=parseFormNote(formsRecords[id]);
      if(data) out.push({id:id, rec:formsRecords[id], data:data});
    });
    out.sort(function(a,b){ return (b.rec.ts||0)-(a.rec.ts||0); });
    return out;
  }
  function newFormId(appendixId){
    return appendixId+':'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  }
  // A Jobber job number, whether typed bare or pasted as a whole Jobber URL.
  function jobNumberFrom(raw){
    var t=String(raw||'').trim(); if(!t) return '';
    var m=t.match(/(?:jobs?|work_orders?)\/(\d+)/i) || t.match(/#?\s*(\d{3,})\s*$/);
    return m ? m[1] : t;
  }

  function saveForm(appendixId, itemId, label, data, doneMsg){
    var pid=subjectId();
    data.v=1; data.form=appendixId;
    data.saved_at=new Date().toISOString();
    var me=TTCRecords.person()||{};
    data.saved_by=me.id||''; data.saved_by_name=me.name||me.display_name||'';
    setSaveState('saving');
    return TTCRecords.recordSet(FORMS_AREA,
        {item_id:itemId, item_label:label, state:formStateForWriter(), note:JSON.stringify(data)},
        pid===((TTCRecords.person()||{}).id) ? null : pid)
      .then(function(){ return TTCRecords.recordsFor(pid, FORMS_AREA); })
      .then(function(m){ formsRecords=m||{}; setSaveState(TTCRecords.configured()?'synced':'local'); refreshAndRerender(); if(doneMsg) showToast(doneMsg, null); })
      .catch(function(err){ setSaveState('error'); alert(err.message||'Could not save this sheet.'); });
  }

  /* ---------- shared header: who was estimating, which job, when ---------- */
  function formHeader(appendixId, draft, fields){
    var wrap=el('div','fm-head');
    fields.forEach(function(f){
      var d=el('div','fm-f'); d.appendChild(el('label',null,f.label));
      var input;
      if(f.type==='person'){
        input=document.createElement('select');
        var list=(window.TTC_PEOPLE||[]).filter(function(p){ return !p.test; });
        list.forEach(function(p){
          var o=document.createElement('option'); o.value=p.person_id; o.textContent=p.display_name;
          input.appendChild(o);
        });
        input.value=draft[f.key]||subjectId();
        // Crew may only record against themselves, so the picker is theirs alone.
        if(!canVerifyForms()){ input.value=(TTCRecords.person()||{}).id; input.disabled=true; }
      } else {
        input=document.createElement('input'); input.type=f.type||'text';
        if(f.placeholder) input.placeholder=f.placeholder;
        input.value=draft[f.key]||'';
      }
      input.onchange=function(){ draft[f.key]=input.value; };
      input.oninput=function(){ draft[f.key]=input.value; };
      if(f.readonly) input.disabled=true;
      d.appendChild(input);
      if(f.hint) d.appendChild(el('p','fm-hint',f.hint));
      wrap.appendChild(d);
    });
    return wrap;
  }

  function savedList(appendixId, title, renderCard){
    var saved=savedFormsOf(appendixId);
    if(!saved.length) return null;
    var box=el('div','fm-saved');
    box.appendChild(el('div','fm-saved-h', title+' — '+saved.length+(saved.length===1?' saved':' saved')));
    saved.forEach(function(sv){
      var card=el('button','fm-card');
      renderCard(card, sv);
      card.onclick=function(){ formOpenSaved[appendixId]=sv.id; formDrafts[appendixId]=null; refreshAndRerender(); };
      box.appendChild(card);
    });
    return box;
  }

  function statePill(rec){
    var st=rec&&rec.state;
    var p=el('span','pill'+(st==='verified'?' ok':(st==='claimed'?' wait':'')),
             st==='verified'?'Verified':(st==='claimed'?'Waiting':'Saved'));
    return p;
  }

  /* ---------- Appendix A — Client Visit Scoring Sheet ---------- */
  function renderAppendixA(A, host){
    var behaviours=[], note=null, scoreLine=null;
    (A.blocks||[]).forEach(function(b){
      if(b.type==='note') note=b.text;
      else if(b.type==='table'){
        var rows=b.rows||[]; if(b.header) rows=rows.slice(1);
        rows.forEach(function(r){ behaviours.push(r[0]); });
      } else if(b.type==='p') scoreLine=b.text;
    });
    if(note) host.appendChild(el('p','note-block',note));

    var openId=formOpenSaved['appendix-a'];
    var openRec=openId?formsRecords[openId]:null;
    var openData=openRec?parseFormNote(openRec):null;
    var readOnly=!!openData;

    var draft=formDrafts['appendix-a'];
    if(!draft){
      draft = openData
        ? {estimator:openData.estimator, job:openData.job, date:openData.date, answers:(openData.answers||[]).slice(),
           items_proposed:openData.items_proposed, items_explained:openData.items_explained}
        : {estimator:subjectId(), job:'', date:todayISOForm(), answers:[]};
      formDrafts['appendix-a']=draft;
    }
    if(!draft.answers) draft.answers=[];

    host.appendChild(formHeader('appendix-a', draft, [
      {key:'estimator', label:'Estimator', type:'person'},
      {key:'job', label:'Client / Job', type:'text', placeholder:'Name, or a Jobber job # / link',
       hint:'Paste a Jobber link and the job number is kept.'},
      {key:'date', label:'Date of visit', type:'date'}
    ]));

    var rowsBox=el('div','fm-rows');
    var scoreBox=el('div','fm-score');
    var segs=[];   // one per behaviour, so a bulk action can repaint every row at once
    function repaintAll(){ segs.forEach(function(seg){ Array.prototype.forEach.call(seg.children, function(c){ c._paint && c._paint(); }); }); }
    function paintScore(){
      var yes=0, applicable=0;
      draft.answers.forEach(function(a){ if(a==='yes'){yes++;applicable++;} else if(a==='no'){applicable++;} });
      var pct = applicable ? Math.round(yes/applicable*100) : null;
      scoreBox.innerHTML='';
      // David's own sentence, with the blanks filled in as they are tapped.
      scoreBox.appendChild(document.createTextNode('Score: '));
      scoreBox.appendChild(el('span','n', String(yes)));
      scoreBox.appendChild(document.createTextNode(' / '));
      scoreBox.appendChild(el('span','n', String(applicable)));
      scoreBox.appendChild(document.createTextNode(' applicable = '));
      scoreBox.appendChild(el('span','n', pct==null?'—':String(pct)));
      scoreBox.appendChild(document.createTextNode(' %'));
      var unanswered = behaviours.length - draft.answers.filter(function(a){ return !!a; }).length;
      if(unanswered>0){
        scoreBox.appendChild(el('span','pending', '   ·   '+unanswered+' still to score'));
      }
      draft._yes=yes; draft._applicable=applicable; draft._pct=pct;
    }

    behaviours.forEach(function(text, i){
      var row=el('div','fm-row'); row.appendChild(el('div','fm-row-text', text));
      var seg=el('div','fm-seg');
      [['yes','Yes'],['no','No'],['na','N/A']].forEach(function(pair){
        var b=el('button','' + pair[0], pair[1]);
        b.type='button';
        function paint(){
          var on = draft.answers[i]===pair[0];
          b.setAttribute('aria-pressed', on?'true':'false');
          row.classList.toggle('answered', !!draft.answers[i]);
        }
        b.onclick=function(){
          if(readOnly) return;
          draft.answers[i] = (draft.answers[i]===pair[0]) ? '' : pair[0];
          Array.prototype.forEach.call(seg.children, function(c){ c._paint && c._paint(); });
          row.classList.toggle('answered', !!draft.answers[i]);
          paintScore();
        };
        b._paint=paint; paint();
        if(readOnly) b.disabled=true;
        seg.appendChild(b);
      });
      row.appendChild(seg); segs.push(seg); rowsBox.appendChild(row);
    });

    // No bulk "Yes to all" here, deliberately. David's own instruction is that a mark means the
    // employee demonstrated the standard, not that they were taught it — a one-tap all-yes on an
    // observation rubric quietly turns scoring into signing. Clearing is the only bulk action.
    if(!readOnly){
      var quick=el('div','fm-actions');
      var none=el('button','btn small','Clear all');
      none.onclick=function(){ draft.answers=[]; repaintAll(); paintScore(); };
      quick.appendChild(none);
      host.appendChild(quick);
    }

    host.appendChild(rowsBox);
    paintScore();
    host.appendChild(scoreBox);

    // ---- work-item count (NOT part of David's thirteen-behaviour rubric) ----------------
    // The rubric scores behaviours once per visit. Three of his standards count WORK ITEMS
    // instead — "explain both the recommendation and the reason for it on >= 90% of proposed
    // work items" has a different denominator than "Yes divided by applicable behaviours", so
    // the rubric alone can never answer it. These two figures are the missing denominator and
    // numerator, captured per visit and totalled under the saved sheets. David's rubric above
    // is untouched; this block is clearly marked as an addition.
    var tally=el('div','fm-tally');
    tally.appendChild(el('div','fm-tally-h','Work items on this visit'));
    tally.appendChild(el('p','fm-tally-note',
      'Counted separately from the behaviour rubric above, because the tier standards about '+
      'recommendation and reason are measured per work item, not per visit. Leave blank if you '+
      'are not counting items on this visit.'));
    var tg=el('div','fm-tally-grid');
    var tallyOut=el('div','fm-tally-out');
    function paintTally(){
      var prop=parseInt(draft.items_proposed,10), expl=parseInt(draft.items_explained,10);
      tallyOut.innerHTML='';
      if(isFinite(prop) && prop>0 && isFinite(expl)){
        if(expl>prop){ tallyOut.appendChild(el('span','dim','More explained than proposed — check the two numbers.')); return; }
        var pc=Math.round(expl/prop*100);
        tallyOut.appendChild(document.createTextNode(expl+' of '+prop+' work items = '+pc+'%'));
      } else {
        tallyOut.appendChild(el('span','dim','Not counted on this visit.'));
      }
    }
    [['items_proposed','Work items proposed'],['items_explained','Recommendation and reason both given']].forEach(function(pair){
      var d=el('div','fm-f'); d.appendChild(el('label',null,pair[1]));
      var inp=document.createElement('input');
      inp.type='number'; inp.min='0'; inp.inputMode='numeric'; inp.placeholder='—';
      inp.value=draft[pair[0]]==null?'':draft[pair[0]];
      inp.oninput=function(){ draft[pair[0]]=inp.value; paintTally(); };
      if(readOnly) inp.disabled=true;
      d.appendChild(inp); tg.appendChild(d);
    });
    tally.appendChild(tg); paintTally(); tally.appendChild(tallyOut);
    host.appendChild(tally);

    // Whoever saved this sheet, and when — read from the record, not typed.
    var me=TTCRecords.person()||{};
    var whoLine = openData
      ? 'Scored by: '+(openData.saved_by_name||personNameById(openData.saved_by||''))+'   ·   Date: '+String(openData.saved_at||'').slice(0,10)
      : 'Scored by: '+(me.name||me.display_name||'')+'   ·   Date: '+todayISOForm();
    host.appendChild(el('p','fm-hint', whoLine));

    var acts=el('div','fm-actions');
    if(readOnly){
      var back=el('button','btn primary','Score a new visit');
      back.onclick=function(){ formOpenSaved['appendix-a']=null; formDrafts['appendix-a']=null; refreshAndRerender(); };
      acts.appendChild(back);
      var again=el('button','btn','Copy into a new sheet');
      again.onclick=function(){
        formOpenSaved['appendix-a']=null;
        formDrafts['appendix-a']={estimator:draft.estimator, job:draft.job, date:todayISOForm(), answers:[]};  // figures start clean
        refreshAndRerender();
      };
      acts.appendChild(again);
    } else {
      var save=el('button','btn primary','Save this scoring sheet');
      save.onclick=function(){
        if(!draft._applicable && !draft.answers.some(function(a){return a==='na';})){
          alert('Score at least one behaviour before saving.'); return;
        }
        var job=jobNumberFrom(draft.job);
        var prop=parseInt(draft.items_proposed,10), expl=parseInt(draft.items_explained,10);
        var haveItems = isFinite(prop) && prop>0 && isFinite(expl) && expl<=prop;
        var payload={estimator:draft.estimator, job:job, date:draft.date||todayISOForm(),
                     answers:draft.answers.slice(), behaviours:behaviours.length,
                     yes:draft._yes, applicable:draft._applicable, pct:draft._pct,
                     items_proposed: haveItems?prop:null, items_explained: haveItems?expl:null};
        var label='Client visit — '+(job||personNameById(draft.estimator))+' — '+
                  (draft._pct==null?'not scored':draft._pct+'%');
        formDrafts['appendix-a']=null;
        saveForm('appendix-a', newFormId('appendix-a'), label, payload, 'Scoring sheet saved.');
      };
      acts.appendChild(save);
      var clear=el('button','btn','Clear');
      clear.onclick=function(){ formDrafts['appendix-a']=null; refreshAndRerender(); };
      acts.appendChild(clear);
    }
    host.appendChild(acts);

    // One sheet answers nothing. Every standard these sheets feed is worded across a run of
    // appointments — a communication-rubric score over fifteen visits, work items over ten.
    // These are those running totals, so the figure is read rather than counted by hand.
    var saved=savedFormsOf('appendix-a');
    if(saved.length){
      var run=el('div','fm-run');
      run.appendChild(el('div','fm-run-h','Running totals across '+saved.length+(saved.length===1?' scored visit':' scored visits')));

      var scored=saved.filter(function(sv){ return sv.data.pct!=null; });
      var l1=el('div','fm-run-line');
      if(scored.length){
        var totYes=0, totApp=0;
        scored.forEach(function(sv){ totYes+=(sv.data.yes||0); totApp+=(sv.data.applicable||0); });
        var avg=scored.reduce(function(a,sv){ return a+sv.data.pct; },0)/scored.length;
        l1.appendChild(document.createTextNode('Communication rubric: '));
        l1.appendChild(el('b',null, Math.round(avg)+'%'));
        l1.appendChild(el('span','dim',' average across '+scored.length+
          (scored.length===1?' visit':' visits')+' · '+totYes+' of '+totApp+' applicable behaviours'));
      } else {
        l1.appendChild(el('span','dim','Communication rubric: nothing scored yet.'));
      }
      run.appendChild(l1);

      var counted=saved.filter(function(sv){ return sv.data.items_proposed; });
      var l2=el('div','fm-run-line');
      if(counted.length){
        var prop=0, expl=0;
        counted.forEach(function(sv){ prop+=sv.data.items_proposed; expl+=(sv.data.items_explained||0); });
        l2.appendChild(document.createTextNode('Recommendation and reason: '));
        l2.appendChild(el('b',null, Math.round(expl/prop*100)+'%'));
        l2.appendChild(el('span','dim',' of work items · '+expl+' of '+prop+' across '+counted.length+
          (counted.length===1?' visit':' visits')));
      } else {
        l2.appendChild(el('span','dim','Recommendation and reason: no work items counted yet.'));
      }
      run.appendChild(l2);
      host.appendChild(run);
    }

    var list=savedList('appendix-a','Scored visits', function(card, sv){
      var d=sv.data;
      card.appendChild(el('span','pct', d.pct==null?'—':d.pct+'%'));
      var meta=el('div','meta');
      meta.appendChild(el('b', null, (d.job?('Job '+d.job):personNameById(d.estimator||''))));
      var sub=(d.date||String(d.saved_at||'').slice(0,10))+' · '+d.yes+' of '+d.applicable+' applicable';
      if(d.items_proposed) sub+=' · '+d.items_explained+'/'+d.items_proposed+' work items';
      sub+=' · scored by '+(d.saved_by_name||personNameById(d.saved_by||''));
      meta.appendChild(el('span', null, sub));
      card.appendChild(meta);
      card.appendChild(statePill(sv.rec));
    });
    if(list) host.appendChild(list);
  }

  /* ---------- Appendix B — Estimate / Production Audit ---------- */
  // "Variance" is computed, not typed, wherever both numbers are numbers — that is the only
  // figure on this sheet that is arithmetic rather than judgement.
  function numOf(raw){
    var t=String(raw==null?'':raw).replace(/[^0-9.\-]/g,'');
    if(!t || t==='-' || t==='.') return null;
    var n=parseFloat(t); return isFinite(n)?n:null;
  }
  function renderAppendixB(A, host){
    var measures=[], headers=['Measure','Estimate','Actual / Senior Benchmark','Variance / Notes'], leads=[];
    (A.blocks||[]).forEach(function(b){
      if(b.type==='p') leads.push(b.text);
      else if(b.type==='table'){
        var rows=b.rows||[];
        if(b.header&&rows.length){ headers=rows[0]; rows=rows.slice(1); }
        rows.forEach(function(r){ measures.push(r[0]); });
      }
    });

    var openId=formOpenSaved['appendix-b'];
    var openRec=openId?formsRecords[openId]:null;
    var openData=openRec?parseFormNote(openRec):null;
    var readOnly=!!openData;

    var draft=formDrafts['appendix-b'];
    if(!draft){
      draft = openData
        ? {estimator:openData.estimator, job:openData.job, date_estimated:openData.date_estimated,
           date_completed:openData.date_completed, rows:(openData.rows||[]).map(function(r){ return r.slice(); })}
        : {estimator:subjectId(), job:'', date_estimated:todayISOForm(), date_completed:'', rows:[]};
      formDrafts['appendix-b']=draft;
    }
    if(!draft.rows) draft.rows=[];
    measures.forEach(function(_,i){ if(!draft.rows[i]) draft.rows[i]=['','','']; });

    // David's three header lines are the fields — same labels, now typed into.
    leads.forEach(function(t){ if(t && !/^(Estimator|Client|Date)/.test(t)) host.appendChild(el('p',null,t)); });

    host.appendChild(formHeader('appendix-b', draft, [
      {key:'estimator', label:'Estimator', type:'person'},
      {key:'job', label:'Client / Job', type:'text', placeholder:'Name, or a Jobber job # / link'},
      {key:'date_estimated', label:'Date Estimated', type:'date'},
      {key:'date_completed', label:'Date Completed', type:'date',
       hint:'Set to today by “Mark completed today”.'}
    ]));

    if(!readOnly){
      var fill=el('button','btn small','Mark completed today');
      fill.onclick=function(){ draft.date_completed=todayISOForm(); refreshAndRerender(); };
      var fw=el('div','fm-actions'); fw.appendChild(fill); host.appendChild(fw);
    }

    // One row per measure, its two fields stacked underneath — never a wide table. Each field
    // keeps David's own column header as its label, so nothing about his wording changes, only
    // how it lays out on a narrow screen.
    var rowsWrap=el('div','fm-rows');
    measures.forEach(function(m,i){
      var row=el('div','fm-row-b');
      row.appendChild(el('div','fm-row-text', m));
      var grid=el('div','fm-head');

      var estField=el('div','fm-f'); estField.appendChild(el('label',null,headers[1]||'Estimate'));
      var estInp=document.createElement('input'); estInp.type='text'; estInp.value=draft.rows[i][0]||'';
      estField.appendChild(estInp); grid.appendChild(estField);

      var actField=el('div','fm-f'); actField.appendChild(el('label',null,headers[2]||'Actual'));
      var actInp=document.createElement('input'); actInp.type='text'; actInp.value=draft.rows[i][1]||'';
      actField.appendChild(actInp); grid.appendChild(actField);

      row.appendChild(grid);
      var varLine=el('div','fm-var');
      function paintVar(){
        varLine.innerHTML='';
        var e=numOf(draft.rows[i][0]), a=numOf(draft.rows[i][1]);
        if(e!=null && a!=null){
          var diff=a-e, pct = e!==0 ? Math.round(diff/Math.abs(e)*100) : null;
          var cls = diff>0?'up':(diff<0?'down':'flat');
          var sign = diff>0?'+':'';
          var stored = sign+(Math.round(diff*100)/100) + (pct==null?'':'  ('+sign+pct+'%)');
          var span=el('span',cls,(headers[3]||'Variance')+': '+stored);
          varLine.appendChild(span);
          draft.rows[i][2]=stored;
        } else {
          var fnote=el('div','fm-f');
          var noteInp=document.createElement('input'); noteInp.type='text'; noteInp.placeholder='Notes';
          noteInp.value=draft.rows[i][2]||'';
          noteInp.oninput=function(){ draft.rows[i][2]=noteInp.value; };
          if(readOnly) noteInp.disabled=true;
          fnote.appendChild(noteInp); varLine.appendChild(fnote);
        }
      }
      estInp.oninput=function(){ draft.rows[i][0]=estInp.value; paintVar(); };
      actInp.oninput=function(){ draft.rows[i][1]=actInp.value; paintVar(); };
      if(readOnly){ estInp.disabled=true; actInp.disabled=true; }
      paintVar();
      row.appendChild(varLine);
      rowsWrap.appendChild(row);
    });
    host.appendChild(rowsWrap);

    var acts=el('div','fm-actions');
    if(readOnly){
      var nb=el('button','btn primary','Audit another job');
      nb.onclick=function(){ formOpenSaved['appendix-b']=null; formDrafts['appendix-b']=null; refreshAndRerender(); };
      acts.appendChild(nb);
    } else {
      var save=el('button','btn primary','Save this audit');
      save.onclick=function(){
        var any=draft.rows.some(function(r){ return (r[0]||'').trim()||(r[1]||'').trim(); });
        if(!any){ alert('Fill in at least one measure before saving.'); return; }
        var job=jobNumberFrom(draft.job);
        var payload={estimator:draft.estimator, job:job, date_estimated:draft.date_estimated,
                     date_completed:draft.date_completed, measures:measures.slice(),
                     rows:draft.rows.map(function(r){ return r.slice(); })};
        var label='Estimate audit — '+(job||personNameById(draft.estimator));
        formDrafts['appendix-b']=null;
        saveForm('appendix-b', newFormId('appendix-b'), label, payload, 'Audit saved.');
      };
      acts.appendChild(save);
      var clear=el('button','btn','Clear');

  /* ---------- Appendix C — Authority Record ---------- */
  // DERIVED, never tapped. Appendix C's six lines are the same six levels as the ladder above
  // it, so letting it be ticked on its own created two sources of truth for one fact: a person
  // could hold "Tier 2" here while Tier 2's items sat unverified. Authority is now read from the
  // ladder — a tier shows as held only when every one of its items is verified.
  var AUTHORITY_LEVEL={
    'estimator trainee':'trainee',
    'tier 1':'tier1',
    'tier 2':'tier2',
    'tier 3':'tier3',
    'phc specialty':'phc',
    'complex removals':'rigging'
  };
  function levelForAuthorityLine(label){
    var l=String(label||'').toLowerCase();
    var keys=Object.keys(AUTHORITY_LEVEL);
    for(var i=0;i<keys.length;i++){ if(l.indexOf(keys[i])===0) return AUTHORITY_LEVEL[keys[i]]; }
    return null;
  }
  function renderAppendixC(A, host){
    var rows=[];
    (A.blocks||[]).forEach(function(b){
      if(b.type==='table') (b.rows||[]).forEach(function(r){ rows.push(r); });
      else if(b.type==='p'||b.type==='note') host.appendChild(el('p',b.type==='note'?'note-block':null,b.text||''));
    });
    // The .docx repeats "Tier 1 — Routine Residential" as both a stray first line and its real
    // row, which on the page put Tier 1 above the Trainee line it comes after. Keep one line per
    // tier and order them by the ladder — David's own level order — rather than by where the
    // duplicate happened to land in the Word table. No wording is edited.
    var levelOrder={}; (D.levels||[]).forEach(function(L,i){ levelOrder[L.id]=i; });
    var seen={}, lines=[];
    rows.forEach(function(r){ var k=r[0]; if(!k||seen[k]) return; seen[k]=true; lines.push(r); });
    lines.sort(function(x,y){
      var a=levelOrder[levelForAuthorityLine(x[0])], b=levelOrder[levelForAuthorityLine(y[0])];
      if(a==null&&b==null) return 0;
      if(a==null) return 1;            // a line with no matching level sinks to the bottom
      if(b==null) return -1;
      return a-b;
    });

    host.appendChild(el('p','fm-tally-note',
      'Read from the ladder above. A line is held once every item in that level is verified, so '+
      'this record and the checklist can never disagree.'));

    var byId={}; (D.levels||[]).forEach(function(L){ byId[L.id]=L; });
    var box=el('div','fm-rows fm-auth');
    lines.forEach(function(r){
      var lid=levelForAuthorityLine(r[0]), L=lid?byId[lid]:null;
      var counts=L?countOf(levelItems(L)):null;
      var held=!!(L && levelFullyVerified(L));

      var row=el('div','fm-row');
      var bx=el('div','box'+(held?' on':'')); bx.appendChild(tick()); row.appendChild(bx);
      var txt=el('div','fm-row-text'); txt.appendChild(document.createTextNode(r[0]));
      if(r[2]) txt.appendChild(el('div','sub', r[2]));
      if(r[3]) txt.appendChild(el('div','sub', r[3]));

      if(!counts){
        txt.appendChild(el('div','sub','No matching level in the ladder.'));
      } else if(held){
        // The affirmative sign-off is the actual grant moment, not the last prerequisite.
        var pass=levelPassItem(L), newest=pass&&recMap()[pass.id];
        txt.appendChild(el('div','sub','Held — all '+counts.total+' training requirements verified'+
          (newest&&newest.by_person_id ? ', last signed off by '+personNameById(newest.by_person_id)+
            ' '+when(new Date(newest.ts).toISOString()) : '')));
      } else {
        var waiting = counts.claimed ? ', '+counts.claimed+' waiting on review' : '';
        txt.appendChild(el('div','sub', counts.verified+' of '+counts.total+' training requirements verified'+waiting));
      }
      row.appendChild(txt);
      box.appendChild(row);
    });
    host.appendChild(box);
  }

  var APPENDIX_FORMS={'appendix-a':renderAppendixA,'appendix-b':renderAppendixB,'appendix-c':renderAppendixC};

  // The two blanks under each tier's sign-off that are FACTS, not typed rules on paper: who
  // signed it off, and when. Read straight from that tier's own sign-off record.
  function levelFieldValue(L, label){
    var l=String(label||'').toLowerCase(), pass=levelPassItem(L), recs=recMap();
    if(l.indexOf('employee')===0) return subject ? subject.name : '';
    if(l.indexOf('notes')===0){
      return pass&&recs[pass.id]&&recs[pass.id].note || '';
    }
    var signed=pass&&recs[pass.id]&&recs[pass.id].state==='verified' ? recs[pass.id] : null;
    if(l.indexOf('date')===0) return signed ? new Date(signed.ts).toISOString().slice(0,10) : '';
    if(signed && signed.by_person_id) return personNameById(signed.by_person_id);
    return '';

  function fieldBlock(label, value, emptyText){

  // "Started" in the summary — the earliest record this person has, not a blank to fill in.
  // Kept as the raw timestamp (not a date-only string) so when() converts it in the visitor's own
  // timezone instead of re-parsing a bare "YYYY-MM-DD" as UTC midnight, which can read a day early.
  function firstRecordTs(){
    var recs=recMap(), ids=Object.keys(recs), first=null;
    ids.forEach(function(id){ var t=recs[id]&&recs[id].ts; if(t && (first===null||t<first)) first=t; });

  /* ---------- state + counting (reads TTCRecords.records('passoff'), synchronous) ---------- */
  // WHOSE checklist is on screen. Normally your own. A trainer or office person can open
  // ?person=<id> to work through someone else's — that is how David marks things off for a crew
  // member without waiting for them to claim it first.
  var subject=null;            // {id, name} — the person the checklist belongs to
  var subjectRecords=null;     // their records when it is not you (own records come from the cache)
  function isOwn(){ return !subject || !TTCRecords.person() || subject.id===TTCRecords.person().id; }
  function recMap(){ return isOwn() ? TTCRecords.records('passoff') : (subjectRecords||{}); }
  function itemState(id){ var r=recMap()[id]; return r?r.state:'open'; }
  function itemRecord(id){ return recMap()[id]||null; }
  function personNameById(id){
    var list=(window.TTC_PEOPLE||[]);
    for(var i=0;i<list.length;i++){ if(list[i].person_id===id) return list[i].display_name; }
    return id;
  }
  function levelItems(L){
    var out=[];
    (L.sections||[]).forEach(function(s){ (s.items||[]).forEach(function(i){ out.push(i); }); });
    return out;
  }
  function levelPassItem(L){
    var options=L.signoff&&L.signoff.items||[];
    return options.filter(function(it){ return /^(pass|ready\b)/i.test(it.text||''); })[0] || options[0] || null;
  }
  function signoffPeers(it){
    var peers=[];
    (D.levels||[]).some(function(L){
      var options=L.signoff&&L.signoff.items||[];
      if(!options.some(function(option){ return option.id===it.id; })) return false;
      peers=options.filter(function(option){ return option.id!==it.id; });
      return true;
    });
    return peers;
  }
  function countOf(items){
    var v=0,c=0,r=0; items.forEach(function(i){ var s=itemState(i.id);
      if(s==='verified')v++; else if(s==='claimed')c++; else if(s==='returned')r++; });
    return {verified:v,claimed:c,returned:r,total:items.length};
  }
  function levelFullyVerified(L){
    var c=countOf(levelItems(L)), pass=levelPassItem(L);
    return c.total>0 && c.verified===c.total && (!pass || itemState(pass.id)==='verified');
  }

  /* ---------- level locking (unchanged: a tier opens once the one before it is signed off) ---------- */
  function computeLevelLocks(levels){
    // levels = D.levels in document order. Returns id -> "opens after <title>" or null.
    var locks={}, byId={}; levels.forEach(function(L){ byId[L.id]=L; });
    var tierOrder=levels.filter(function(L){ return L.kind!=='endorsement'; });
    tierOrder.forEach(function(L,i){
      if(i===0){ locks[L.id]=null; return; }
      var prev=tierOrder[i-1];
      locks[L.id] = levelFullyVerified(prev) ? null : prev.title;
    });
    var tier1=byId['tier1'];
    levels.filter(function(L){ return L.kind==='endorsement'; }).forEach(function(L){
      locks[L.id] = (tier1 && !levelFullyVerified(tier1)) ? tier1.title : null;
    });
    return locks;
  }

  // Short label for the stepper and the crew-list strip: the part of David's own title before the
  // dash for a tier ("Tier 1"), the part after it for an endorsement ("Plant Health Care (PHC)").
  function shortName(L){
    var t=String(L.title||''), parts=t.split(' — ');
    if(parts.length<2) return t;
    return L.kind==='endorsement' ? parts.slice(1).join(' — ') : parts[0];

  function writeState(it, state, note, meta, undoMsg, prevState, prevNote){
    var composed=note||'';
    setSaveState('saving');
    var targetId=isOwn() ? TTCRecords.person().id : subject.id;
    var peers=signoffPeers(it), save;
    if(state==='verified' && peers.length){
      var changes=[{person_id:targetId, area:'passoff', item_id:it.id, item_label:it.text, state:state, note:composed}];
      peers.forEach(function(peer){ changes.push({person_id:targetId, area:'passoff', item_id:peer.id, item_label:peer.text, state:'open', note:''}); });
      save=TTCRecords.recordBatch(changes);
    } else {
      save=TTCRecords.recordSet('passoff', {item_id:it.id, item_label:it.text, state:state, note:composed},
                                isOwn() ? null : subject.id);
    }
    save.then(function(){ return isOwn() ? TTCRecords.loadRecords('passoff') :
      TTCRecords.passoffRecordsFor(subject.id).then(function(m){ subjectRecords=m; }); })
      .then(function(){ setSaveState(TTCRecords.configured()?'synced':'local'); refreshAndRerender();
        if(undoMsg) showToast(undoMsg, prevState!=null?function(){ writeState(it, prevState, prevNote||''); }:null);
      })
      .catch(function(err){ setSaveState('error'); alert(err.message||'Could not save.'); });
  }
