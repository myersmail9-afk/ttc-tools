      if(lockTitle) tt.appendChild(el('div','level-lock-chip','Opens after '+lockTitle+' sign-off'));
      head.appendChild(tt);
      var cc=el('div','level-count tabular'); var b=el('b',null,cnt.verified+'/'+cnt.total);
      cc.appendChild(b); cc.appendChild(document.createTextNode(cnt.claimed?cnt.claimed+' waiting':'verified'));
      head.appendChild(cc);
      head.appendChild(el('div','level-chev','›'));
      head.onclick=function(){
        var open=box.classList.toggle('is-open');
        head.setAttribute('aria-expanded', open?'true':'false');
        UI.levels[L.id]=open; saveUI();
      };
      box.appendChild(head);

      var bar=el('div','level-bar'), fill=el('i');
      fill.style.width=(cnt.total?Math.round(cnt.verified/cnt.total*100):0)+'%'; bar.appendChild(fill); box.appendChild(bar);

      var body=el('div','level-body');
      if(L.purpose) body.appendChild(el('p','level-purpose',L.purpose));
      if(L.meta_table) body.appendChild(tableOf(L.meta_table));

      (L.sections||[]).forEach(function(S){ body.appendChild(sectionRow(S, isLocked?lockTitle:null)); });

      if(L.signoff){
        var so=el('div','signoff');
        so.appendChild(el('div','signoff-head',L.signoff.title||'Sign-off'));
        var sb=el('div','signoff-body');
        if(L.signoff.intro&&L.signoff.intro.length){ var g=el('div','blocks'); blocks(L.signoff.intro,g); sb.appendChild(g); }
        (L.signoff.items||[]).forEach(function(i){ sb.appendChild(itemRow(i, isLocked?lockTitle:null)); });
        if(L.signoff.fields&&L.signoff.fields.length){
          var ff=el('div','fields');
          L.signoff.fields.forEach(function(f){
            ff.appendChild(fieldBlock(f.label, levelFieldValue(L, f.label),
              /notes/i.test(f.label) ? 'No notes' : 'Not signed off'));
          });
          sb.appendChild(ff);
        }
        so.appendChild(sb); body.appendChild(so);
      }
      box.appendChild(body);
      root.appendChild(box);
    });

    if(D.appendices&&D.appendices.length){
      root.appendChild(el('h2','part','Appendices'));
      D.appendices.forEach(function(A){
        var d=el('details','appx'), s=el('summary',null,A.title); d.appendChild(s);
        var bb=el('div','appx-body blocks');
        var form=APPENDIX_FORMS[A.id];
        if(form){ d.open = !!APPX_OPEN[A.id]; form(A,bb); }
        else blocks(A.blocks,bb);
        d.addEventListener('toggle',function(){ APPX_OPEN[A.id]=d.open; });
        d.appendChild(bb); root.appendChild(d);
      });
    }

    var f=el('div','foot');
    f.appendChild(document.createTextNode('Every word on this page is David’s, taken from the original document. '));
    var a=el('a',null,'Download the original (.docx)'); a.href='../../../files/training/qualified-estimator-pass-off.docx';
    f.appendChild(a); root.appendChild(f);
  }

  function setDefaultOpenState(){
    var levels=D.levels||[];
    var haveAnyLevelPref = levels.some(function(L){ return Object.prototype.hasOwnProperty.call(UI.levels,L.id); });
    if(haveAnyLevelPref) return;
    for(var i=0;i<levels.length;i++){
      var L=levels[i];
      if(!levelFullyVerified(L)){
        UI.levels[L.id]=true;
        var secs=L.sections||[];
        for(var j=0;j<secs.length;j++){
          var S=secs[j], its=S.items||[], c=countOf(its);
          if(!(c.total&&c.verified===c.total)){ UI.sections[S.id]=true; break; }
        }
        break;
      }
    }
    saveUI();
  }

  // A reviewer opening the pass-off gets their CREW, not a 127-item document. Anyone with items
  // waiting on them is highlighted and sorted to the top; tapping a person opens their checklist.
  function renderCrewList(){
    root.innerHTML='';
    var head=el('div','crew-head');
    head.appendChild(el('p','doc-eyebrow','Qualified Estimator Pass-Off'));
    head.appendChild(el('h1',null,'Your crew'));
    root.appendChild(head);
    var sum=el('p','crew-sum','Loading…'); root.appendChild(sum);
    var list=el('div'); root.appendChild(list);

    var links=el('div','crew-links');
    var mine=el('a',null,'Open my own pass-off →'); mine.href='?person='+encodeURIComponent(TTCRecords.person().id);
    links.appendChild(mine);
    var doc=el('a',null,'Read the whole document →'); doc.href='?doc=1'; links.appendChild(doc);
    root.appendChild(links);

    TTCRecords.insights().then(function(res){
      var people=(res.people||[]).filter(function(p){ return p.role==='crew'||p.role==='trainer'; });
      var waiting=people.filter(function(p){ return p.items_waiting_review>0; });
      sum.innerHTML='';
      if(waiting.length){
        var n=waiting.reduce(function(a,p){ return a+p.items_waiting_review; },0);
        sum.appendChild(el('b',null, n+(n===1?' item':' items')+' from '+waiting.length+
          (waiting.length===1?' person':' people')+' waiting on you.'));
        sum.appendChild(document.createTextNode(' Tap a name to verify them.'));
      } else {
        sum.textContent='Nothing waiting on you. Tap a name to mark items off for someone.';
      }
      people.forEach(function(p){
        var row=el('button','crew-row'+(p.items_waiting_review>0?' has-waiting':''));
        var av=el('div','crew-av');
        if(p.photo){ var im=document.createElement('img'); im.src=p.photo; im.alt=''; av.appendChild(im); }
        else av.textContent=(p.name||'').split(/\s+/).map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();
        row.appendChild(av);
        var mid=el('div','crew-mid');
        mid.appendChild(el('div','crew-name',p.name));
        // currentLevel is an object ({title, nextSection, ...}), not a string — printing it raw
        // rendered "[object Object]" on every row.
        var cl=p.currentLevel, tier = (cl && (cl.title || cl.levelTitle || cl.name)) ||
               (typeof p.level==='string' ? p.level : '') || 'Not started';
        mid.appendChild(el('div','crew-tier', tier));
        var bar=el('div','crew-bar'), fill=el('i');
        fill.style.width=(p.passoff_total?Math.round(p.passoff_verified/p.passoff_total*100):0)+'%';
        bar.appendChild(fill); mid.appendChild(bar);
        row.appendChild(mid);
        var right=el('div','crew-right');
        if(p.items_waiting_review>0){
          right.appendChild(el('span','crew-wait', p.items_waiting_review+' waiting'));
          if(p.oldest_waiting_days>0) right.appendChild(el('div','crew-count','oldest '+p.oldest_waiting_days+'d'));
        } else {
          right.appendChild(el('span','crew-quiet','up to date'));
        }
        right.appendChild(el('div','crew-count', p.passoff_verified+'/'+p.passoff_total+' verified'));
        row.appendChild(right);
        row.onclick=function(){ location.href='?person='+encodeURIComponent(p.person_id); };
        list.appendChild(row);
      });
      if(!people.length) list.appendChild(el('p','crew-quiet','No crew members found.'));
    }).catch(function(err){ sum.textContent='Could not load the crew: '+(err.message||'unknown error'); });
  }

  function boot(){
    var self=TTCRecords.person();
    if(!self){ renderSignIn(); return; }
    var wanted=null, wantDoc=false;
    try{ var qs=new URLSearchParams(location.search); wanted=qs.get('person'); wantDoc=qs.get('doc')==='1'; }catch(e){}
    // A reviewer with no person chosen lands on their crew list, not on the document.
    if(!wanted && !wantDoc && TTCRecords.can('verify_others')){ renderCrewList(); return; }
    if(wanted && wanted!==self.id && !TTCRecords.can('verify_others')){
      root.innerHTML=''; root.appendChild(el('div','loading','You can only open your own pass-off.')); return;
    }
    subject = (wanted && wanted!==self.id)
      ? { id:wanted, name:personNameById(wanted) }
      : { id:self.id, name:self.name||self.display_name||'' };
    root.innerHTML='<div class="loading">Loading…</div>';
    loadUI(subject.id);
    loadFilter(subject.id);
    maybeMigrateLegacy(self).then(function(){
      return isOwn() ? TTCRecords.loadRecords('passoff')
                     : TTCRecords.passoffRecordsFor(subject.id).then(function(m){ subjectRecords=m; });
    }).then(function(){
      // Saved scoring sheets and audits belong to the person whose page is open, not the viewer.
      return TTCRecords.recordsFor(subject.id, FORMS_AREA)
        .then(function(m){ formsRecords=m||{}; })
        .catch(function(){ formsRecords={}; });   // a missing area is an empty history, never a dead page
    }).then(function(){
      if(D) setDefaultOpenState();
      return TTCRecords.passoffCurrentLevel(subject.id);
    }).then(function(cl){
      currentLevelCache=cl;
      render();
    }).catch(function(err){ root.innerHTML=''; root.appendChild(el('div','loading','Could not load: '+(err.message||'unknown error'))); });
  }

  TTCRecords.ready().then(boot);
})();
</script>
