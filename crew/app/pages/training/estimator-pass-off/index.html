  /* ---------- a lettered group: a flat row that expands to its standards ---------- */
  function groupRow(S, guideS, lockTitle){
    guideS = guideS || {};
    var items=S.items||[], c=countOf(items);
    var m=/^([A-Za-z0-9]+)\.\s*(.*)$/.exec(S.title||'');
    var letter = m ? m[1] : '';
    var titleRest = m ? m[2] : (S.title||'');
    var allDone = c.total>0 && c.verified===c.total;

    var isOpen=!!UI.sections[S.id];
    var box=el('div','grp'); box.dataset.open=isOpen?'1':'0'; box.id='grp-'+S.id;

    var head=el('button','grp-head'); head.type='button'; head.setAttribute('aria-expanded',isOpen?'true':'false');
    head.appendChild(el('span','grp-letter'+(allDone?' done':''), letter));
    var titles=el('div','grp-titles');
    titles.appendChild(el('div','grp-title', titleRest));
    if(guideS.short) titles.appendChild(el('div','grp-short', guideS.short));
    head.appendChild(titles);
    var countTxt = allDone ? ('done · '+c.verified+'/'+c.total) : (c.claimed ? (c.claimed+' waiting · '+c.verified+'/'+c.total) : (c.verified+'/'+c.total));
    head.appendChild(el('span','grp-count'+(allDone?' done':''), countTxt));
    head.appendChild(el('span','grp-chev','›'));
    head.onclick=function(){
      var open=box.dataset.open==='1'; box.dataset.open=open?'0':'1';
      head.setAttribute('aria-expanded',open?'false':'true');
      UI.sections[S.id]=!open; saveUI();
    };
    box.appendChild(head);

    var body=el('div','grp-body');
    if(guideS.for) body.appendChild(elWithLabel('grp-note','What it’s for:', guideS.for));
    if(guideS.how) body.appendChild(elWithLabel('grp-note','How it’s checked:', guideS.how));
    items.forEach(function(it){ body.appendChild(standardRow(it, lockTitle)); });
    box.appendChild(body);
    return box;
  }

  /* ---------- stage sign-off: David's decision for the whole stage, never a standard row ---------- */
  function signoffBlock(L, guideL, lockTitle){
    var so=el('div','signoff'); so.id='signoff-'+L.id;
    so.appendChild(el('div','signoff-head','David’s sign-off'));
    var body=el('div','signoff-body');
    if(guideL.signoff) body.appendChild(el('p',null,guideL.signoff));

    var options=(L.signoff&&L.signoff.items)||[];
    var canVerify=TTCRecords.can('verify_others');
    var current=options.filter(function(o){ return itemState(o.id)==='verified'; })[0];

    if(canVerify && !lockTitle){
      var seg=el('div','signoff-options');
      options.forEach(function(o){
        var picked=itemState(o.id)==='verified';
        var b=el('button','btn'+(picked?' good':''), o.text); b.type='button';
        b.setAttribute('aria-pressed', picked?'true':'false');
        b.onclick=function(){
          var prevRec=itemRecord(o.id), prevState=prevRec?prevRec.state:'open', prevNote=prevRec?prevRec.note:'';
          if(picked) writeState(o,'open','',null,'Undid the sign-off.', prevState, prevNote);
          else writeState(o,'verified','',null,'Recorded: '+o.text+'.', prevState, prevNote);
        };
        seg.appendChild(b);
      });
      body.appendChild(seg);
    } else {
      body.appendChild(el('p',null, current ? ('Current decision: '+current.text) :
        (lockTitle ? 'Opens after '+lockTitle+' is signed off.' : 'Not signed off yet.')));
    }

    if(L.signoff.fields && L.signoff.fields.length){
      var ff=el('div','fields');
      L.signoff.fields.forEach(function(f){
        ff.appendChild(fieldBlock(f.label, levelFieldValue(L,f.label), /notes/i.test(f.label)?'No notes':'Not signed off'));
      });
      body.appendChild(ff);
    }
    so.appendChild(body);
    return so;
  }

  /* ---------- summary: flat, the first thing on the page ---------- */
  function renderSummary(cl, curLevelObj){
    var box=el('div','summary');
    var me=TTCRecords.person()||{};
    var name = subject ? subject.name : (me.name||me.display_name||'');
    box.appendChild(el('h1',null,name));
    box.appendChild(el('p','summary-line','Trainer: '+((GUIDE.trainer&&GUIDE.trainer.name)||'David Thunell')));
    var startedTs=firstRecordTs();
    if(startedTs) box.appendChild(el('p','summary-line','Started '+when(startedTs)));

    if(cl && !cl.allDone){
      var gl=(GUIDE.levels||{})[cl.id]||{};
      var stageBox=el('div','summary-stage');
      stageBox.appendChild(el('div','summary-stage-name', gl.name||cl.title));
      var bar=el('div','crew-bar'); var fill=el('i'); fill.style.width=(cl.total?Math.round(cl.verified/cl.total*100):0)+'%'; bar.appendChild(fill);
      stageBox.appendChild(bar);
      stageBox.appendChild(el('div','summary-stage-count', cl.verified+' of '+cl.total+' standards passed'));
      box.appendChild(stageBox);

      if(curLevelObj){
        var cnt=countOf(levelItems(curLevelObj));
        var notes=[];
        if(cnt.claimed) notes.push(cnt.claimed+' waiting for David');
        if(cnt.returned) notes.push(cnt.returned+' sent back');
        if(notes.length) box.appendChild(el('p','summary-notes', notes.join('   ·   ')));
      }

      var btnLabel = cl.waitingForSignoff
        ? 'Continue: '+(gl.name||cl.title)+' sign-off'
        : 'Continue: '+(cl.nextSection?cl.nextSection.title:(gl.name||cl.title));
      var btn=el('button','btn primary full', btnLabel); btn.type='button';
      btn.onclick=function(){ goToCurrentStage(cl); };
      box.appendChild(btn);
    } else if(cl && cl.allDone){
      box.appendChild(el('p','summary-notes','Every stage is complete.'));
    }

    var status=el('p','save-state',saveStateText()); status.id='save-state'; status.setAttribute('data-state',saveState);
    box.appendChild(status);
    return box;
  }

  /* ---------- how this works: David's own explanation + the 4-mark legend ---------- */
  function renderHowThisWorks(){
    var d=document.createElement('details'); d.className='howto'; if(UI.howto) d.open=true;
    d.appendChild(el('summary',null,'How this works'));
    var body=el('div','blocks');

    var ul=el('ul'); (GUIDE.how_it_works||[]).forEach(function(t){ ul.appendChild(el('li',null,t)); }); body.appendChild(ul);

    var legend=el('div','legend');
    ['open','claimed','verified','returned'].forEach(function(st){
      var m=(GUIDE.marks||{})[st]||{};
      var row=el('div','legend-row');
      row.appendChild(markEl(st,'sm'));
      var txt=el('div','legend-text'); txt.appendChild(el('b',null,m.label||st)); txt.appendChild(el('span',null,m.help||''));
      row.appendChild(txt);
      legend.appendChild(row);
    });
    body.appendChild(legend);

    if(D.intro && D.intro.length){
      var more=document.createElement('details'); more.className='more';
      more.appendChild(el('summary',null,'David’s full instructions'));
      var ib=el('div','blocks'); blocks(D.intro, ib); more.appendChild(ib);
      body.appendChild(more);
    }
    d.appendChild(body);
    d.addEventListener('toggle',function(){ UI.howto=d.open; saveUI(); });
    return d;
  }

  /* ---------- stages: a stepper, not a document ---------- */
  function renderStages(cl){
    var wrap=el('div','stagebar-wrap'); wrap.id='stages';
    var levels=D.levels||[], locks=computeLevelLocks(levels), canVerify=TTCRecords.can('verify_others');
    var GL=GUIDE.levels||{};
    var tiers=levels.filter(function(L){ return L.kind!=='endorsement'; });
    var ends=levels.filter(function(L){ return L.kind==='endorsement'; });

    function seg(L){
      var done=levelFullyVerified(L);
      var lockTitleRaw=locks[L.id]; var locked=!!lockTitleRaw && !canVerify;
      var current=!!(cl && !cl.allDone && cl.id===L.id);
      var cnt=countOf(levelItems(L));
      var b=el('button','stagebtn'+(done?' is-done':'')+(current?' is-current':'')+(locked?' is-locked':''));
      b.type='button';
      b.setAttribute('aria-selected', UI.stage===L.id?'true':'false');
      if(done){ var ic=tick(); ic.setAttribute('width','16'); ic.setAttribute('height','16'); b.appendChild(ic); }
      else if(locked){ var lk=lockIcon(); lk.setAttribute('width','16'); lk.setAttribute('height','16'); b.appendChild(lk); }
      b.appendChild(el('span','stagebtn-lbl', (GL[L.id]&&GL[L.id].short)||shortName(L)));
      var cap = done?'Passed':(current?'Current':(locked?'Locked':(cnt.verified+'/'+cnt.total)));
      b.appendChild(el('span','stagebtn-cap', cap));
      var a11yName=(GL[L.id]&&GL[L.id].name)||L.title;
      b.setAttribute('aria-label', a11yName+': '+(done?'passed':(locked?'locked, opens after '+lockTitleRaw:(cnt.verified+' of '+cnt.total+' passed'))));
      b.onclick=function(){
        UI.stage=L.id; saveUI(); render();
        var t=document.getElementById('panel'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
      };
      return b;
    }

    var row1=el('div','stages-row'); row1.setAttribute('role','tablist'); row1.setAttribute('aria-label','Stages');
    tiers.forEach(function(L){ row1.appendChild(seg(L)); });
    wrap.appendChild(row1);
    if(ends.length){
      wrap.appendChild(el('div','stages-sub','Specialties'));
      var row2=el('div','stages-row'); row2.setAttribute('role','tablist'); row2.setAttribute('aria-label','Specialty stages');
      ends.forEach(function(L){ row2.appendChild(seg(L)); });
      wrap.appendChild(row2);
    }
    return wrap;
  }
  function goToCurrentStage(cl){
    if(!cl) return;
    UI.stage=cl.id;
    if(cl.waitingForSignoff){
      saveUI(); render();
      var t=document.getElementById('signoff-'+cl.id); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
      return;
    }
    if(cl.nextSection) UI.sections[cl.nextSection.id]=true;
    saveUI(); render();
    var target=document.getElementById(cl.nextSection?('grp-'+cl.nextSection.id):'panel');
    if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function ensureDefaultStage(cl){
    var ids=(D.levels||[]).map(function(L){ return L.id; });
    if(!UI.stage || ids.indexOf(UI.stage)===-1){ UI.stage = cl ? cl.id : (ids[0]||null); saveUI(); }
  }

  /* ---------- the selected stage's panel: heading, David's wording, groups, sign-off ---------- */
  function renderStagePanel(L, cl){
    var guideL=(GUIDE.levels||{})[L.id]||{};
    var canVerify=TTCRecords.can('verify_others');
    var lockTitleRaw=computeLevelLocks(D.levels||[])[L.id];
    var lockTitle=(lockTitleRaw && !canVerify) ? lockTitleRaw : null;

    var panel=el('div','panel'); panel.id='panel';
    panel.appendChild(el('h2','panel-title', guideL.name||L.title));
    if(lockTitle) panel.appendChild(el('p','panel-locked','Opens after '+lockTitle+' is signed off.'));
    if(guideL.clears) panel.appendChild(elWithLabel('panel-clears','Passing clears you for:', guideL.clears));
    if(guideL.before) panel.appendChild(elWithLabel('panel-before','Before this stage:', guideL.before));

    if(L.purpose || L.meta_table){
      var d=document.createElement('details'); d.className='more';
      d.appendChild(el('summary',null,'David’s wording'));
      var b=el('div','blocks');
      if(L.purpose) b.appendChild(el('p',null,L.purpose));
      if(L.meta_table) b.appendChild(tableOf(L.meta_table));
      d.appendChild(b); panel.appendChild(d);
    }

    var glist=el('div','grp-list');
    (L.sections||[]).forEach(function(S){ glist.appendChild(groupRow(S, guideL.sections&&guideL.sections[S.id], lockTitle)); });
    panel.appendChild(glist);

    if(L.signoff) panel.appendChild(signoffBlock(L, guideL, lockTitle));
    return panel;
  }

  /* ---------- tools: the three appendices, clearly set apart from the ladder above ---------- */
  function renderTools(){
    var wrap=document.createElement('div');
    wrap.appendChild(el('h2','part','Tools for every visit and job'));
    var GT=GUIDE.tools||{};
    (D.appendices||[]).forEach(function(A){
      var meta=GT[A.id]||{};
      var dtl=el('details','appx');
      var s=document.createElement('summary');
      var lbl=el('div',null);
      lbl.appendChild(el('div',null, meta.name||A.title));
      if(meta.david) lbl.appendChild(el('div','appx-sub', meta.david));
      s.appendChild(lbl);
      dtl.appendChild(s);
      var bb=el('div','appx-body blocks');
      if(meta.for) bb.appendChild(el('p','note-block', meta.for));
      if(meta.not) bb.appendChild(el('p','appx-not', meta.not));
      var form=APPENDIX_FORMS[A.id];
      if(form){
        dtl.open=!!APPX_OPEN[A.id];
        form(A,bb);
        // Anything tapped inside a form re-renders the page; the appendix it happened in must
        // still be open afterwards. Capture-phase, so it runs before the handler that re-renders.
        bb.addEventListener('click', function(){ APPX_OPEN[A.id]=true; }, true);
      } else blocks(A.blocks,bb);
      s.addEventListener('click',function(){ APPX_OPEN[A.id]=!dtl.open; });   // fires before the state flips
      dtl.addEventListener('toggle',function(){ APPX_OPEN[A.id]=dtl.open; });  // and covers keyboard/programmatic opens
      dtl.appendChild(bb); wrap.appendChild(dtl);
    });
    return wrap;
  }

  function renderFooter(){
    var f=el('div','foot');
    f.appendChild(document.createTextNode('The standards are word for word from David’s Qualified Estimator Pass-Off. '));
    var a=el('a',null,'Download the original (.docx)'); a.href='../../../files/training/qualified-estimator-pass-off.docx';
    f.appendChild(a);
    return f;
  }

  /* ---------- main render ---------- */
  var currentLevelCache=null;
  function refreshAndRerender(){
    TTCRecords.passoffCurrentLevel(subject?subject.id:TTCRecords.person().id).then(function(cl){ currentLevelCache=cl; render(); });
  }

  function render(){
    root.innerHTML='';
    if(!D){ var w=el('div','loading');
      w.textContent='The pass-off data file has not been generated yet (data/passoff.js).'; root.appendChild(w); return; }

    if(!isOwn()){
      var wb=el('div','working-on');
      wb.appendChild(document.createTextNode('You’re working on '));
      wb.appendChild(el('b',null, subject.name));
      wb.appendChild(document.createTextNode('’s pass-off.'));
      var back=el('a','working-on-back','Back to mine'); back.href='./';
      wb.appendChild(back);
      root.appendChild(wb);
    }

    var levels=D.levels||[];
    var curLevelObj = currentLevelCache ? levels.filter(function(x){ return x.id===currentLevelCache.id; })[0]||null : null;

    root.appendChild(renderSummary(currentLevelCache, curLevelObj));
    root.appendChild(renderHowThisWorks());
    root.appendChild(renderStages(currentLevelCache));

    var stageId = (UI.stage && levels.some(function(x){ return x.id===UI.stage; }))
      ? UI.stage : (currentLevelCache?currentLevelCache.id:(levels[0]&&levels[0].id));
    var L = levels.filter(function(x){ return x.id===stageId; })[0];
    if(L) root.appendChild(renderStagePanel(L, currentLevelCache));

    root.appendChild(renderTools());
    root.appendChild(renderFooter());
  }

  // A reviewer opening the pass-off gets their CREW, not a 127-item document. Anyone with items
  // waiting on them is highlighted and sorted to the top; tapping a person opens their checklist.
  function renderCrewList(prefetched){
    root.innerHTML='';
    var head=el('div','crew-head');
    head.appendChild(el('p','doc-eyebrow','Qualified Estimator Pass-Off'));
    head.appendChild(el('h1',null,'Your crew'));
    root.appendChild(head);
    var sum=el('p','crew-sum','Loading…'); root.appendChild(sum);
    var key=el('div','stages-key');
    key.appendChild(el('span',null,'Each bar: Trainee → Tier 3, then PHC and Rigging'));
    [['p','in progress'],['d','passed'],['w','waiting on you']].forEach(function(k){
      var sp=el('span'); sp.appendChild(el('i',k[0])); sp.appendChild(document.createTextNode(k[1])); key.appendChild(sp); });
    root.appendChild(key);
    var list=el('div'); root.appendChild(list);

    var links=el('div','crew-links');
    var mine=el('a',null,'Open my own pass-off →'); mine.href='?person='+encodeURIComponent(TTCRecords.person().id);
    links.appendChild(mine);
    var doc=el('a',null,'Read the whole document →'); doc.href='?doc=1'; links.appendChild(doc);
    root.appendChild(links);

    (prefetched ? Promise.resolve(prefetched) : TTCRecords.insights()).then(function(res){
      var people=(res.people||[]).filter(function(p){ return p.role==='crew'||p.role==='trainer'; });
      var waiting=people.filter(function(p){ return p.items_waiting_review>0; });
      sum.innerHTML='';
      if(waiting.length){
        var n=waiting.reduce(function(a,p){ return a+p.items_waiting_review; },0);
        sum.appendChild(el('b',null, n+(n===1?' item':' items')+' from '+waiting.length+
          (waiting.length===1?' person':' people')+' waiting on you.'));
        sum.appendChild(document.createTextNode(' Tap a name to verify them.'));
      } else {
        sum.textContent='Nothing waiting on you. Tap a name to mark items off for someone.';
      }
      people.forEach(function(p){
        var row=el('button','crew-row'+(p.items_waiting_review>0?' has-waiting':''));
        var av=el('div','crew-av');
        if(p.photo){ var im=document.createElement('img'); im.src=p.photo; im.alt=''; av.appendChild(im); }
        else av.textContent=(p.name||'').split(/\s+/).map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();
        row.appendChild(av);
        var mid=el('div','crew-mid');
        mid.appendChild(el('div','crew-name',p.name));
        // currentLevel is an object ({title, nextSection, ...}), not a string — printing it raw
        // rendered "[object Object]" on every row.
        var cl=p.currentLevel, tier = (cl && (cl.title || cl.levelTitle || cl.name)) ||
               (typeof p.level==='string' ? p.level : '') || 'Not started';
        var tierEl=el('div','crew-tier', tier); mid.appendChild(tierEl);
        var stripHost=el('div'); mid.appendChild(stripHost);
        row.appendChild(mid);
        var right=el('div','crew-right');
        if(p.items_waiting_review>0){
          right.appendChild(el('span','crew-wait', p.items_waiting_review+' waiting'));
          if(p.oldest_waiting_days>0) right.appendChild(el('div','crew-count','oldest '+p.oldest_waiting_days+'d'));
        } else {
          right.appendChild(el('span','crew-quiet','up to date'));
        }
        var progressEl=el('div','crew-count',cl&&cl.total!=null?cl.verified+'/'+cl.total+' this tier':'Loading tier…');
        right.appendChild(progressEl);
        row.appendChild(right);
        row.onclick=function(){ location.href='?person='+encodeURIComponent(p.person_id); };
        list.appendChild(row);
        // The overview response may be cached by an older backend. Ask the shared per-tier helper
        // for the authoritative current tier so this screen never falls back to 0/127.
        // One read per person gives both the whole ladder (for the strip) and the current tier.
        TTCRecords.passoffRecordsFor(p.person_id).then(function(recs){
          recs=recs||{};
          stripHost.innerHTML=''; stripHost.appendChild(stageStrip(recs));
          var fresh=TTCRecords.currentLevelFromRecords ? TTCRecords.currentLevelFromRecords(recs) : null;
          if(!fresh) return;
          tierEl.textContent=fresh.allDone ? 'Every level complete' : (fresh.title || 'Not started');
          progressEl.textContent=fresh.allDone ? 'all passed' : fresh.verified+'/'+fresh.total+(fresh.waitingForSignoff?' ready for sign-off':' this tier');
        }).catch(function(){});
      });
      if(!people.length) list.appendChild(el('p','crew-quiet','No crew members found.'));
    }).catch(function(err){ sum.textContent='Could not load the crew: '+(err.message||'unknown error'); });
  }
  function stageStrip(recs){
    var strip=el('div','stages'); strip.setAttribute('role','img');
    var said=[];
    (D.levels||[]).forEach(function(L){
      var items=levelItems(L), v=0, c=0;
      items.forEach(function(i){ var r=recs[i.id]; if(r&&r.state==='verified') v++; else if(r&&r.state==='claimed') c++; });
      var done=items.length&&v===items.length;
      var seg=el('span','stage'+(L.kind==='endorsement'?' end':'')+(done?' done':'')+(c?' waiting':''));
      var f=el('i'); f.style.width=(items.length?v/items.length*100:0)+'%'; seg.appendChild(f);
      seg.title=shortName(L)+': '+v+'/'+items.length+(c?', '+c+' waiting':'');
      said.push(seg.title);
      strip.appendChild(seg);
    });
    strip.setAttribute('aria-label',said.join('; '));
    return strip;
  }

  var stopAutoSync=null;

  function stopWatching(){
    if(stopAutoSync){ stopAutoSync(); stopAutoSync=null; }
  }

  function loadSubjectBundle(){
    var passoff=isOwn() ? TTCRecords.loadRecords('passoff') : TTCRecords.passoffRecordsFor(subject.id);
    return Promise.all([
      passoff,
      TTCRecords.recordsFor(subject.id, FORMS_AREA).catch(function(){ return {}; })
    ]).then(function(res){ return { passoff:res[0]||{}, forms:res[1]||{} }; });
  }

  function applySubjectBundle(bundle){
    if(!isOwn()) subjectRecords=bundle.passoff;
    formsRecords=bundle.forms;
    currentLevelCache=TTCRecords.currentLevelFromRecords(bundle.passoff);
    if(D) ensureDefaultStage(currentLevelCache);
    setSaveState(TTCRecords.configured()?'synced':'local');
    render();
  }

  function boot(){
    stopWatching();
    var self=TTCRecords.person();
    if(!self){ renderSignIn(); return; }
    var wanted=null, wantDoc=false;
    try{ var qs=new URLSearchParams(location.search); wanted=qs.get('person'); wantDoc=qs.get('doc')==='1'; }catch(e){}
    // A reviewer with no person chosen lands on their crew list, not on the document.
    if(!wanted && !wantDoc && TTCRecords.can('verify_others')){
      root.innerHTML='<div class="loading">Loading the crew…</div>';
      stopAutoSync=TTCRecords.watchVisible('passoff-crew', TTCRecords.insights, function(res){ renderCrewList(res); }, {
        onError:function(err){ root.innerHTML=''; root.appendChild(el('div','loading','Could not load the crew: '+(err.message||'unknown error'))); }
      });
      return;
    }
    if(wanted && wanted!==self.id && !TTCRecords.can('verify_others')){
      root.innerHTML=''; root.appendChild(el('div','loading','You can only open your own pass-off.')); return;
    }
    subject = (wanted && wanted!==self.id)
      ? { id:wanted, name:personNameById(wanted) }
      : { id:self.id, name:self.name||self.display_name||'' };
    root.innerHTML='<div class="loading">Loading…</div>';
    loadUI(subject.id);
    maybeMigrateLegacy(self).then(function(){
      return loadSubjectBundle();
    }).then(function(bundle){
      applySubjectBundle(bundle);
      stopAutoSync=TTCRecords.watchVisible('passoff:'+subject.id, loadSubjectBundle, applySubjectBundle, {initial:false,
        onError:function(){ setSaveState('offline'); }
      });
    }).catch(function(err){ root.innerHTML=''; root.appendChild(el('div','loading','Could not load: '+(err.message||'unknown error'))); });
  }

  TTCRecords.on('syncstate',function(s){
    if(!s.configured) setSaveState('local');
    else if(s.status==='saving') setSaveState('saving');
    else if(s.status==='offline') setSaveState('offline');
    else if(s.status==='error') setSaveState('error');
    else if(s.status==='synced') setSaveState('synced');
  });
  TTCRecords.ready().then(function(){ setSaveState(TTCRecords.configured()?'synced':'local'); boot(); });
})();
</script>
<script defer src="../../../shared/profile-button.js"></script>
